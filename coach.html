<title>Coach — remise en forme</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap');

/* ─────────────────────────────────────────────────────────────
   Palette. Le thème clair est la définition de base ; le sombre
   ne redéfinit que les jetons, une fois pour le réglage système
   et une fois pour le choix explicite, afin que le bouton de
   bascule l'emporte dans les deux sens.
   ───────────────────────────────────────────────────────────── */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface2:#EDF1F6; --sunk:#E4EAF2;
  --line:#DCE3ED; --line2:#C7D2E0;
  --text:#0E141C; --text2:#33445A; --muted:#68788D;
  --accent:#0F8F6B; --accent-soft:rgba(15,143,107,.10); --on-accent:#FFFFFF;
  --force:#C1462B; --force-soft:rgba(193,70,43,.10);
  --cardio:#1F6FCC; --cardio-soft:rgba(31,111,204,.10);
  --recup:#7A4BC4; --recup-soft:rgba(122,75,196,.10);
  --warn:#B07206; --warn-soft:rgba(176,114,6,.12);
  --ok:#0F8F6B; --bad:#C1462B;
  --shadow:0 1px 2px rgba(14,20,28,.05),0 8px 24px -12px rgba(14,20,28,.18);
  --shadow-lg:0 2px 4px rgba(14,20,28,.06),0 24px 48px -20px rgba(14,20,28,.28);
  --r:14px; --r-lg:20px; --r-sm:9px;
  --sans:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Outfit','Inter',ui-sans-serif,system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080A0E; --surface:#12161D; --surface2:#181E27; --sunk:#0D1116;
    --line:#232B37; --line2:#334053;
    --text:#EDF1F6; --text2:#BCC7D6; --muted:#7E8DA1;
    --accent:#4FE0AC; --accent-soft:rgba(79,224,172,.12); --on-accent:#052018;
    --force:#FF8A62; --force-soft:rgba(255,138,98,.12);
    --cardio:#5CB8FF; --cardio-soft:rgba(92,184,255,.12);
    --recup:#B58CFF; --recup-soft:rgba(181,140,255,.12);
    --warn:#FFC163; --warn-soft:rgba(255,193,99,.13);
    --ok:#4FE0AC; --bad:#FF8A62;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 24px 48px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --bg:#080A0E; --surface:#12161D; --surface2:#181E27; --sunk:#0D1116;
  --line:#232B37; --line2:#334053;
  --text:#EDF1F6; --text2:#BCC7D6; --muted:#7E8DA1;
  --accent:#4FE0AC; --accent-soft:rgba(79,224,172,.12); --on-accent:#052018;
  --force:#FF8A62; --force-soft:rgba(255,138,98,.12);
  --cardio:#5CB8FF; --cardio-soft:rgba(92,184,255,.12);
  --recup:#B58CFF; --recup-soft:rgba(181,140,255,.12);
  --warn:#FFC163; --warn-soft:rgba(255,193,99,.13);
  --ok:#4FE0AC; --bad:#FF8A62;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5),0 24px 48px -20px rgba(0,0,0,.85);
}

*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ── Structure ────────────────────────────────────────────── */
.app{max-width:940px;margin:0 auto;padding:0 16px 132px;min-height:100vh}
.topbar{position:sticky;top:0;z-index:60;margin:0 -16px 4px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--cardio)));
  color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.02em}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand-txt span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-act{margin-left:auto;display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:var(--text2);
  border:1px solid var(--line);background:var(--surface);transition:.15s}
.icon-btn:hover{color:var(--text);border-color:var(--line2)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.view{display:none;animation:rise .32s cubic-bezier(.2,.7,.3,1)}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ── Barre d'onglets ──────────────────────────────────────── */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;justify-content:center;
  padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid var(--line)}
.tabbar-in{display:flex;gap:2px;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border-radius:12px;
  color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.01em;transition:.15s}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.tab.on svg{stroke-width:2.1}
.tab:active{transform:scale(.94)}

/* ── Blocs ────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;
  box-shadow:var(--shadow);margin-bottom:14px}
.card.flat{box-shadow:none}
.card.tight{padding:14px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:500}
.sec-title{font-family:var(--display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;
  color:var(--muted);margin:26px 2px 10px}
.sec-title:first-child{margin-top:14px}
.hero-h{font-family:var(--display);font-size:clamp(1.5rem,6vw,2rem);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.lead{color:var(--text2);font-size:14px}
.muted{color:var(--muted)}
.tiny{font-size:12px;line-height:1.5}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
@media (max-width:520px){.g3{grid-template-columns:repeat(2,1fr)}}

/* ── Statistiques ─────────────────────────────────────────── */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;position:relative;overflow:hidden}
.stat .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  display:flex;align-items:center;gap:5px}
.stat .v{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin-top:5px;
  font-variant-numeric:tabular-nums}
.stat .u{font-size:13px;font-weight:600;color:var(--muted);margin-left:2px}
.stat .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.stat.accent .v{color:var(--accent)} .stat.force .v{color:var(--force)}
.stat.cardio .v{color:var(--cardio)} .stat.recup .v{color:var(--recup)}
.delta{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)} .delta.flat{color:var(--muted)}

/* ── Boutons ──────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border-radius:12px;
  border:1px solid var(--line2);background:var(--surface);color:var(--text);font-size:14px;font-weight:600;
  transition:.15s;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.975)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 14px -6px var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.lg{padding:15px 22px;font-size:15px;border-radius:14px;width:100%}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.42;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ── Étiquettes ───────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;
  letter-spacing:.02em;background:var(--surface2);color:var(--text2);border:1px solid var(--line);white-space:nowrap}
.badge.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.force{background:var(--force-soft);color:var(--force);border-color:transparent}
.badge.cardio{background:var(--cardio-soft);color:var(--cardio);border-color:transparent}
.badge.recup{background:var(--recup-soft);color:var(--recup);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}

/* ── Formulaire ───────────────────────────────────────────── */
.field{margin-bottom:14px}
.field>label{display:block;font-size:12.5px;font-weight:700;color:var(--text2);margin-bottom:6px;letter-spacing:.01em}
.field .hint{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:5px;line-height:1.45}
.inp{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);
  font-size:15px;transition:.15s;appearance:none}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select.inp{background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea.inp{min-height:76px;resize:vertical;line-height:1.5}
.inp-num{text-align:center;font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border-radius:11px;border:1px solid var(--line2);background:var(--surface);
  font-size:13.5px;font-weight:600;color:var(--text2);transition:.15s;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--line2);background:var(--surface2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:13px;border-radius:13px;border:1px solid var(--line2);
  background:var(--surface);cursor:pointer;transition:.15s;text-align:left;width:100%}
.opt:hover{background:var(--surface2)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.opt .oi{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--surface2);font-size:17px}
.opt.on .oi{background:var(--accent);color:var(--on-accent)}
.opt b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em}
.opt span{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}
.sw{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sw:last-child{border-bottom:0}
.sw-t{flex:1;min-width:0}
.sw-t b{display:block;font-size:14px;font-weight:600}
.sw-t span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.sw-x{width:44px;height:26px;border-radius:999px;background:var(--line2);position:relative;flex:none;transition:.2s}
.sw-x::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  transition:.2s cubic-bezier(.2,.8,.3,1);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on .sw-x{background:var(--accent)}
.sw.on .sw-x::after{transform:translateX(18px)}

/* ── Curseur ──────────────────────────────────────────────── */
.rng{width:100%;height:32px;background:none;appearance:none}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:var(--sunk);border:1px solid var(--line)}
.rng::-webkit-slider-thumb{appearance:none;width:24px;height:24px;border-radius:50%;background:var(--accent);
  margin-top:-10px;border:3px solid var(--surface);box-shadow:0 2px 8px -2px var(--accent)}
.rng::-moz-range-track{height:6px;border-radius:99px;background:var(--sunk);border:1px solid var(--line)}
.rng::-moz-range-thumb{width:20px;height:20px;border:3px solid var(--surface);border-radius:50%;background:var(--accent)}
.rng-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.rng-h b{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent)}

/* ── Barres de progression ────────────────────────────────── */
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.3,1)}
.bar.thin{height:5px}
.bar>i.force{background:var(--force)} .bar>i.cardio{background:var(--cardio)} .bar>i.warn{background:var(--warn)}

/* ── Anneau ───────────────────────────────────────────────── */
.ring{position:relative;display:grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .trk{stroke:var(--sunk)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.3,1)}
.ring-c{position:absolute;text-align:center;line-height:1.05}
.ring-c b{display:block;font-family:var(--display);font-size:27px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring-c span{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-top:2px}
</style>
<style>
/* ── Séance : exercice et séries ──────────────────────────── */
.exo{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:10px;overflow:hidden;
  transition:border-color .2s}
.exo.done{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.exo-h{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;user-select:none}
.exo-n{width:29px;height:29px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--surface2);
  font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted)}
.exo.done .exo-n{background:var(--accent);color:var(--on-accent)}
.exo-t{flex:1;min-width:0}
.exo-t b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.exo-t span{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.exo-c{width:20px;height:20px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;
  stroke-linejoin:round;transition:transform .25s}
.exo.open .exo-c{transform:rotate(180deg)}
.exo-b{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.exo.open .exo-b{display:block}
.exo-note{font-size:12.5px;color:var(--text2);background:var(--sunk);border-radius:10px;padding:10px 12px;margin:12px 0;line-height:1.5}
.exo-note b{color:var(--text)}

.serie{display:grid;grid-template-columns:26px 1fr 1fr 58px 38px;gap:7px;align-items:center;padding:6px 0}
.serie-h{display:grid;grid-template-columns:26px 1fr 1fr 58px 38px;gap:7px;padding:8px 0 4px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center}
.serie-h span:first-child{text-align:left}
.serie-i{width:26px;font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--muted);text-align:center}
.serie .inp{padding:9px 4px;font-family:var(--mono);font-weight:700;text-align:center;font-size:15px}
.serie .rpe-in{padding:9px 2px;font-size:14px}
.chk{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line2);display:grid;place-items:center;
  transition:.15s;background:var(--surface);justify-self:center}
.chk svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;
  opacity:.35;transition:.15s}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on svg{stroke:var(--on-accent);opacity:1}
.chk:active{transform:scale(.9)}
.serie.warmup .serie-i{color:var(--warn)}
.prev{font-size:11px;color:var(--muted);font-family:var(--mono);text-align:center;padding:2px 0 8px}

/* ── Minuteur ─────────────────────────────────────────────── */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 78px);z-index:80;
  display:none;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;background:var(--surface);
  border:1px solid var(--line2);box-shadow:var(--shadow-lg);width:calc(100% - 32px);max-width:420px}
.timer.on{display:flex;animation:rise .25s}
.timer-v{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;
  min-width:66px}
.timer-t{flex:1;min-width:0}
.timer-t b{display:block;font-size:12.5px;font-weight:700}
.timer-t .bar{margin-top:5px}
.timer-x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);flex:none}
.timer-x svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}

/* ── Fenêtre modale ───────────────────────────────────────── */
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;
  background:rgba(4,6,10,.55);backdrop-filter:blur(3px);padding:0}
.modal.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-c{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:8px 18px calc(env(safe-area-inset-bottom) + 22px);
  animation:slide .3s cubic-bezier(.2,.8,.3,1);box-shadow:var(--shadow-lg)}
@keyframes slide{from{transform:translateY(28px)}to{transform:none}}
@media (min-width:640px){.modal{align-items:center;padding:20px}.modal-c{border-radius:22px;border-bottom:1px solid var(--line);padding-bottom:22px}}
.modal-grip{width:38px;height:4px;border-radius:99px;background:var(--line2);margin:6px auto 14px}
.modal-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.modal-h h3{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.02em;flex:1}

/* ── Bibliothèque d'exercices ─────────────────────────────── */
.lib-i{display:flex;align-items:center;gap:12px;padding:12px 13px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface);margin-bottom:8px;cursor:pointer;transition:.15s;text-align:left;width:100%}
.lib-i:hover{border-color:var(--line2);background:var(--surface2)}
.lib-g{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--surface2)}
.lib-t{flex:1;min-width:0}
.lib-t b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
.lib-t span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── Graphiques ───────────────────────────────────────────── */
.chart{width:100%;overflow:visible;display:block}
.chart .grid-l{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--mono)}
.chart .ln{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chart .area{stroke:none;opacity:.13}
.chart .pt{stroke:var(--surface);stroke-width:2}
.chart .br{rx:3}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{text-align:center;padding:32px 18px;color:var(--muted)}
.empty .ei{font-size:30px;margin-bottom:10px;opacity:.5}
.empty b{display:block;font-size:14px;color:var(--text2);margin-bottom:4px;font-weight:700}
.empty p{font-size:12.5px;line-height:1.5;max-width:280px;margin:0 auto}

/* ── Assiduité ────────────────────────────────────────────── */
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 28%,var(--sunk));border-color:transparent}
.heat i.l2{background:color-mix(in srgb,var(--accent) 62%,var(--sunk));border-color:transparent}
.heat i.l3{background:var(--accent);border-color:transparent}
.heat i.today{box-shadow:0 0 0 2px var(--text)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:5px;font-size:9.5px;font-weight:700;
  color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}

/* ── Journée du programme ─────────────────────────────────── */
.day{display:flex;align-items:center;gap:12px;padding:13px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface);margin-bottom:8px;transition:.15s;width:100%;text-align:left;cursor:pointer}
.day:hover{border-color:var(--line2)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.done{opacity:.62}
.day-d{width:44px;flex:none;text-align:center}
.day-d b{display:block;font-family:var(--display);font-size:19px;font-weight:800;line-height:1;letter-spacing:-.02em}
.day-d span{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:2px}
.day-t{flex:1;min-width:0}
.day-t b{display:block;font-size:14px;font-weight:700;letter-spacing:-.01em}
.day-t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-k{width:3px;align-self:stretch;border-radius:99px;flex:none;background:var(--line2);min-height:36px}
.day-k.force{background:var(--force)} .day-k.cardio{background:var(--cardio)}
.day-k.recup{background:var(--recup)} .day-k.repos{background:var(--line2)}

/* ── Divers ───────────────────────────────────────────────── */
.split{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.split:last-child{border-bottom:0}
.split .sl{font-size:13.5px;color:var(--text2);font-weight:500}
.split .sv{font-family:var(--mono);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 11px 11px 0;padding:11px 14px;
  font-size:13px;line-height:1.55;color:var(--text2);margin:12px 0}
.note b{color:var(--text)}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note.force{border-color:var(--force);background:var(--force-soft)}
.scroll-x{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.toast{position:fixed;left:50%;transform:translate(-50%,14px);bottom:calc(env(safe-area-inset-bottom) + 88px);z-index:300;
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:13px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s cubic-bezier(.2,.8,.3,1);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
.hide{display:none!important}
.pill-nav{display:flex;gap:4px;padding:4px;background:var(--sunk);border-radius:13px;border:1px solid var(--line);margin-bottom:14px}
.pill-nav button{flex:1;padding:8px 6px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--muted);transition:.15s}
.pill-nav button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
</style>

<script>
"use strict";
/* ─── 2. État et stockage ─────────────────────────────────────────────
   Une seule clé localStorage, versionnée, avec fusion des valeurs par
   défaut : une mise à jour de l'application n'efface jamais l'historique. */
const CLE = 'coach.v1';
const DEFAUTS = {
  version: 1,
  profil: {
    prenom:'', sexe:'h', age:35, taille:175, poidsDepart:80,
    objectif:'recomposition', niveau:'debutant', activite:1.375,
    joursSemaine:3, jours:['lun','mer','ven'], duree:60,
    lieux:['salle'], options:{sismo:false, visbody:false, water:false},
    contraintes:[], sommeilCible:7.5, debut:null, cree:null
  },
  reglages:{ theme:'auto', reposDefaut:90, sonTimer:true, uniteCharge:'kg',
    rappelPesee:true, arrondi:2.5, seriesEchauffement:true },
  seances:[], mesures:[], checkins:[], nutrition:[], prs:{},
  personnalises:{}   /* substitutions d'exercices choisies par l'utilisateur */
};

function fusion(base, sur){
  if (Array.isArray(base)) return Array.isArray(sur) ? sur : base;
  if (base && typeof base === 'object'){
    const o = {...base};
    if (sur && typeof sur === 'object') for (const k of Object.keys(sur)) o[k] = fusion(base[k] === undefined ? sur[k] : base[k], sur[k]);
    return o;
  }
  return sur === undefined ? base : sur;
}
let S = structuredClone(DEFAUTS);
function charger(){
  try{
    const brut = localStorage.getItem(CLE);
    if (brut) S = fusion(structuredClone(DEFAUTS), JSON.parse(brut));
  }catch(e){ console.warn('Lecture impossible, on repart des valeurs par défaut.', e); }
}
let sauvegardeEnAttente = null;
function sauver(){
  clearTimeout(sauvegardeEnAttente);
  sauvegardeEnAttente = setTimeout(() => {
    try{ localStorage.setItem(CLE, JSON.stringify(S)); }
    catch(e){ toast("Stockage plein — pensez à exporter vos données."); }
  }, 120);
}

/* ─── 3. Utilitaires ──────────────────────────────────────────────── */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const rnd = (v, p=1) => Math.round(v * 10**p) / 10**p;
const cap = s => String(s).charAt(0).toUpperCase() + String(s).slice(1);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const JOURS = [['lun','Lundi'],['mar','Mardi'],['mer','Mercredi'],['jeu','Jeudi'],['ven','Vendredi'],['sam','Samedi'],['dim','Dimanche']];
const JOUR_CLE = ['dim','lun','mar','mer','jeu','ven','sam'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MOIS_COURT = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];

const iso = d => { const x = new Date(d); x.setHours(12,0,0,0); return x.toISOString().slice(0,10); };
const aujourdhui = () => iso(new Date());
const dateDe = s => { const [a,m,j] = s.split('-').map(Number); return new Date(a, m-1, j, 12); };
const joursEntre = (a, b) => Math.round((dateDe(b) - dateDe(a)) / 864e5);
const plusJours = (s, n) => iso(new Date(dateDe(s).getTime() + n * 864e5));
function dateLongue(s){ const d = dateDe(s); return `${JOURS[(d.getDay()+6)%7][1].toLowerCase()} ${d.getDate()} ${MOIS[d.getMonth()]}`; }
function dateCourte(s){ const d = dateDe(s); return `${d.getDate()} ${MOIS_COURT[d.getMonth()]}`; }

/* Arrondit une charge au pas de matériel disponible (2,5 kg par défaut). */
const arrondiCharge = kg => { const p = S.reglages.arrondi || 2.5; return Math.max(0, Math.round(kg / p) * p); };
const fmtKg = kg => (kg % 1 === 0 ? kg : rnd(kg, 1)) + ' kg';
const fmtDuree = min => min >= 60 ? `${Math.floor(min/60)} h ${String(min%60).padStart(2,'0')}` : `${min} min`;

function toast(msg, ms=2600){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function ouvrirModal(html){
  $('#modal-c').innerHTML = '<div class="modal-grip"></div>' + html;
  $('#modal').classList.add('on');
  $('#modal-c').scrollTop = 0;
}
function fermerModal(){ $('#modal').classList.remove('on'); }

/* Anneau de progression, en SVG pur. */
function anneau(pct, taille=104, ep=9, couleur='var(--accent)', centre=''){
  const r = (taille - ep) / 2, c = 2 * Math.PI * r;
  const off = c * (1 - clamp(pct, 0, 1));
  return `<div class="ring" style="width:${taille}px;height:${taille}px">
    <svg width="${taille}" height="${taille}"><circle class="trk" cx="${taille/2}" cy="${taille/2}" r="${r}" stroke-width="${ep}"/>
    <circle class="val" cx="${taille/2}" cy="${taille/2}" r="${r}" stroke-width="${ep}" stroke="${couleur}"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
    <div class="ring-c">${centre}</div></div>`;
}
function barre(pct, cls=''){ return `<div class="bar"><i class="${cls}" style="width:${clamp(pct,0,1)*100}%"></i></div>`; }
function delta(v, unite='', inverse=false){
  if (v === null || v === undefined || !isFinite(v)) return '';
  const signe = v > 0 ? '+' : '';
  const bon = inverse ? v < 0 : v > 0;
  const cls = Math.abs(v) < 0.05 ? 'flat' : (bon ? 'up' : 'down');
  return `<span class="delta ${cls}">${signe}${rnd(v,1)}${unite}</span>`;
}
</script>

};

  debutant:     {n:'Débutant',     d:'Moins de 6 mois de pratique régulière', series:[3,4], rpe:[6,7.5], prog:0.05},
  intermediaire:{n:'Intermédiaire',d:'1 à 3 ans, technique acquise',          series:[3,5], rpe:[7,8.5], prog:0.025},
  avance:       {n:'Avancé',       d:'Plus de 3 ans, progression lente',      series:[4,5], rpe:[7.5,9], prog:0.015}
};
const ACTIVITES = [
  {v:1.2,   n:'Sédentaire',      d:'Bureau, peu de marche'},
  {v:1.375, n:'Légèrement actif',d:'Quelques milliers de pas, debout par moments'},
  {v:1.55,  n:'Actif',           d:'Beaucoup de marche ou métier physique'},
  {v:1.725, n:'Très actif',      d:'Métier physique et déplacements quotidiens'}
];
const CONTRAINTES = [
  {v:'dos',     n:'Dos sensible',      d:'On évite la charge axiale et les buste penché lourds'},
  {v:'genou',   n:'Genou sensible',    d:'Amplitudes contrôlées, on privilégie la presse et les machines'},
  {v:'epaule',  n:'Épaule sensible',   d:'Pas de barre au front ni de dips profonds'},
  {v:'poignet', n:'Poignet sensible',  d:'Prises neutres et haltères plutôt que barre droite'}
];

/* Poids actuel : dernière pesée connue, sinon le poids de départ. */
function poidsActuel(){
  const m = S.mesures.filter(x => x.poids > 0).sort((a,b) => a.date < b.date ? 1 : -1);
  return m.length ? m[0].poids : S.profil.poidsDepart;
}
/* Moyenne mobile du poids : le seul chiffre honnête, la pesée du jour
   variant de ±1,5 kg selon le sel, l'eau et le transit. */
function poidsLisse(jours=7, finIso=null){
  const fin = finIso || aujourdhui();
  const fenetre = S.mesures.filter(m => m.poids > 0 && m.date <= fin && joursEntre(m.date, fin) < jours);
  if (!fenetre.length) return null;
  return fenetre.reduce((s, m) => s + m.poids, 0) / fenetre.length;
}
/* Tendance hebdomadaire, en comparant deux moyennes mobiles espacées de 7 jours. */
function tendancePoids(){
  const a = poidsLisse(7), b = poidsLisse(7, plusJours(aujourdhui(), -7));
  return (a !== null && b !== null) ? a - b : null;
}

function metriques(){
  const p = S.profil, poids = poidsActuel(), t = p.taille / 100;
  const imc = poids / (t * t);
  /* Mifflin-St Jeor : la référence pour le métabolisme de base. */
  const mb = 10 * poids + 6.25 * p.taille - 5 * p.age + (p.sexe === 'h' ? 5 : -161);
  const de = mb * p.activite;                                  /* dépense quotidienne */
  const obj = OBJECTIFS[p.objectif];
  let kcal = Math.round(de * (1 + obj.kcal));
  const plancher = Math.round(mb * 1.1);                       /* on ne descend jamais sous 110 % du métabolisme de base */
  const sousPlancher = kcal < plancher;
  if (sousPlancher) kcal = plancher;
  kcal = Math.round(kcal / 10) * 10;
  /* Masse grasse estimée (Deurenberg) tant qu'aucun scan n'est enregistré. */
  const derniereMG = [...S.mesures].filter(m => m.mg > 0).sort((a,b) => a.date < b.date ? 1 : -1)[0];
  const mgEstimee = 1.20 * imc + 0.23 * p.age - 10.8 * (p.sexe === 'h' ? 1 : 0) - 5.4;
  const mg = derniereMG ? derniereMG.mg : clamp(mgEstimee, 4, 60);
  const masseMaigre = poids * (1 - mg / 100);
  /* Macronutriments : protéines par kilo de poids, lipides plancher, glucides en solde. */
  const prot = Math.round(obj.prot * poids);
  const lip  = Math.round(Math.max(0.8 * poids, kcal * 0.22 / 9));
  const glu  = Math.max(40, Math.round((kcal - prot * 4 - lip * 9) / 4));
  /* Fréquence cardiaque : Tanaka, plus fiable que 220 − âge après 40 ans. */
  const fcMax = Math.round(208 - 0.7 * p.age);
  const zones = [
    {z:'Z1', n:'Récupération',  a:.50, b:.60, d:'Marche active, on récupère'},
    {z:'Z2', n:'Endurance',     a:.60, b:.70, d:'On peut parler par phrases : le cœur du cardio'},
    {z:'Z3', n:'Tempo',         a:.70, b:.80, d:'Phrases courtes, effort soutenable'},
    {z:'Z4', n:'Seuil',         a:.80, b:.90, d:'Quelques mots, ça pique'},
    {z:'Z5', n:'Maximal',       a:.90, b:1.0, d:'Fractionné court uniquement'}
  ].map(z => ({...z, min:Math.round(fcMax*z.a), max:Math.round(fcMax*z.b)}));
  const eau = Math.round((35 * poids + (p.joursSemaine * p.duree / 7) * 8) / 50) * 50;
  const proteinesParRepas = Math.round(prot / 4);
  return {poids, imc, mb:Math.round(mb), de:Math.round(de), kcal, plancher, sousPlancher,
    mg:rnd(mg,1), mgMesuree:!!derniereMG, masseMaigre:rnd(masseMaigre,1),
    prot, lip, glu, fcMax, zones, eau, proteinesParRepas, obj};
}

/* Répétition maximale estimée (Epley), et la table des pourcentages. */
const e1rm = (kg, reps) => reps <= 0 ? 0 : (reps === 1 ? kg : kg * (1 + reps / 30));
const chargePour = (max, reps) => max / (1 + reps / 30);

/* Score de forme du jour : ce qui décide si la séance se fait telle
   quelle, allégée, ou remplacée par de la récupération.               */
function scoreForme(c){
  if (!c) return null;
  const p = x => clamp((x - 1) / 4, 0, 1);                       /* échelles 1-5 → 0-1 */
  const s = 100 * (
    0.28 * p(c.sommeil) + 0.24 * p(c.energie) +
    0.22 * (1 - p(c.courbatures)) + 0.16 * (1 - p(c.stress)) + 0.10 * p(c.motivation ?? 3)
  );
  return Math.round(s);
}
function checkinDuJour(){ return S.checkins.find(c => c.date === aujourdhui()) || null; }
function consigneForme(score){
  if (score === null) return {t:'Forme non renseignée', d:"Faites le point du matin pour que la séance s'ajuste.", cls:'', f:1};
  if (score >= 75) return {t:'Excellente forme', d:"Feu vert : c'est le jour pour tenter une charge de plus.", cls:'accent', f:1.05};
  if (score >= 48) return {t:'Bonne forme', d:'Séance normale, telle qu’elle est programmée.', cls:'accent', f:1};
  if (score >= 32) return {t:'Forme moyenne', d:'On garde les charges mais on retire une série par exercice.', cls:'warn', f:0.82};
  return {t:'Forme basse', d:'Séance allégée : moitié du volume, ou récupération active à la place.', cls:'force', f:0.6};
}

/* Volume hebdomadaire par groupe musculaire, en séries dures. */
function volumeSemaine(finIso=null){
  const fin = finIso || aujourdhui(), v = {};
  for (const s of S.seances){
    if (!s.termine || s.date > fin || joursEntre(s.date, fin) >= 7) continue;
    for (const ex of s.exercices || []){
      const e = EXO_MAP[ex.ex]; if (!e || e.g === 'car' || e.g === 'mob') continue;
      const n = (ex.series || []).filter(x => x.fait && !x.echauffement).length;
      v[e.g] = (v[e.g] || 0) + n;
    }
  }
  return v;
}
const CIBLE_VOLUME = {pec:[8,16], dos:[10,18], epa:[6,14], bra:[6,14], qua:[8,16], isc:[8,16], mol:[4,10], gai:[4,12]};

/* Tonnage : charge × répétitions, l'indicateur de travail total. */
function tonnage(s){
  return (s.exercices || []).reduce((t, ex) =>
    t + (ex.series || []).reduce((u, x) => u + (x.fait && !x.echauffement ? num(x.charge) * num(x.reps) : 0), 0), 0);
}

/* Records : on garde la meilleure répétition maximale estimée par exercice. */
function majPRs(seance){
  let nouveaux = [];
  for (const ex of seance.exercices || []){
    for (const x of ex.series || []){
      if (!x.fait || x.echauffement) continue;
      const kg = num(x.charge), reps = num(x.reps);
      if (kg <= 0 || reps <= 0) continue;
      const est = e1rm(kg, reps);
      const pr = S.prs[ex.ex];
      if (!pr || est > pr.e1rm + 0.01){
        S.prs[ex.ex] = {e1rm:rnd(est,1), charge:kg, reps, date:seance.date};
        if (pr) nouveaux.push({ex:ex.ex, avant:pr.e1rm, apres:rnd(est,1)});
      }
    }
  }
  return nouveaux;
}
/* Dernière performance sur un exercice, pour proposer la charge du jour. */
function derniereSerie(exId){
  const faites = S.seances.filter(s => s.termine).sort((a,b) => a.date < b.date ? 1 : -1);
  for (const s of faites){
    const ex = (s.exercices || []).find(e => e.ex === exId);
    if (!ex) continue;
    const ok = (ex.series || []).filter(x => x.fait && !x.echauffement && num(x.charge) > 0);
    if (ok.length) return {date:s.date, series:ok};
  }
  return null;
}
/* Double progression : on ajoute des répétitions jusqu'au haut de la
   fourchette, puis on monte la charge et on repart en bas.            */
function chargeProposee(exId, repsCible, rpeCible){
  const d = derniereSerie(exId);
  if (!d) return null;
  const meilleure = d.series.reduce((m, x) => num(x.charge) > num(m.charge) ? x : m, d.series[0]);
  const kg = num(meilleure.charge), reps = num(meilleure.reps), rpe = num(meilleure.rpe) || rpeCible;
  const pas = NIVEAUX[S.profil.niveau].prog;
  if (reps >= repsCible && rpe <= rpeCible) return {kg:arrondiCharge(kg * (1 + pas)), motif:'montée', ref:d};
  if (reps >= repsCible)                    return {kg:arrondiCharge(kg), motif:'répéter', ref:d};
  return {kg:arrondiCharge(kg), motif:'compléter', ref:d};
}

/* Le bilan hebdomadaire : ce que le coach ajusterait à votre place. */
function ajustements(){
  const m = metriques(), t = tendancePoids(), out = [];
  const objectif = S.profil.objectif;
  const parSemaine = t !== null ? t / m.poids * 100 : null;
  if (parSemaine !== null){
    if (objectif === 'perte' || objectif === 'recomposition'){
      if (parSemaine > -0.15 && parSemaine < 0.25)
        out.push({t:'La perte est à l’arrêt', d:`Le poids lissé bouge de ${rnd(t,2)} kg sur sept jours. Retirez 150 kcal par jour, ou ajoutez une séance de cardio en zone 2.`, cls:'warn'});
      else if (parSemaine < -1.1)
        out.push({t:'La perte est trop rapide', d:`${rnd(parSemaine,1)} % par semaine, c’est au-dessus du seuil où l’on garde son muscle. Remontez de 150 kcal et gardez les protéines hautes.`, cls:'force'});
      else if (parSemaine <= -0.15)
        out.push({t:'Rythme idéal', d:`${rnd(t,2)} kg sur sept jours : on ne change rien, ni les calories ni le volume.`, cls:''});
    }
    if (objectif === 'muscle'){
      if (parSemaine < 0.05) out.push({t:'La prise ne décolle pas', d:'Ajoutez 150 kcal par jour, essentiellement en glucides autour de la séance.', cls:'warn'});
      else if (parSemaine > 0.5) out.push({t:'Prise trop rapide', d:'Au-delà de 0,5 % par semaine, l’excédent part surtout en gras. Retirez 150 kcal.', cls:'force'});
    }
  }
  const derniers = S.checkins.slice(-3).map(scoreForme).filter(x => x !== null);
  if (derniers.length === 3 && derniers.every(x => x < 45))
    out.push({t:'Trois jours de forme basse', d:'Anticipez la semaine de décharge : volume réduit de 40 %, charges inchangées, et deux nuits longues.', cls:'force'});
  const faites = S.seances.filter(s => s.termine && joursEntre(s.date, aujourdhui()) < 7).length;
  if (S.seances.filter(s => s.termine).length >= 3){
    const v = volumeSemaine();
    const oublies = ['dos','qua','isc','pec'].filter(g => (v[g] || 0) === 0);
    if (oublies.length)
      out.push({t:`${oublies.map(g => GROUPES[g].n).join(', ')} : rien cette semaine`,
        d:`Aucune série dure sur les sept derniers jours pour ${oublies.length > 1 ? 'ces groupes' : 'ce groupe'}. Le plancher utile est de ${CIBLE_VOLUME[oublies[0]][0]} séries par semaine.`, cls:'warn'});
  }
  if (faites >= S.profil.joursSemaine)
    out.push({t:'Semaine complète', d:`${faites} séances honorées sur ${S.profil.joursSemaine} prévues. C’est l’assiduité qui fait les résultats, pas la séance parfaite.`, cls:''});
  else if (joursEntre(S.profil.debut || aujourdhui(), aujourdhui()) > 7 && faites === 0)
    out.push({t:'Aucune séance cette semaine', d:'Reprenez par la séance la plus courte du programme plutôt que d’attendre le bon jour.', cls:'force'});
  if (!out.length) out.push({t:'Pas assez de données', d:'Après deux pesées et deux séances, cet écran devient un vrai bilan avec des ajustements chiffrés.', cls:''});
  return out;
}

<script>
"use strict";
/* ─── 5. Générateur de programme ──────────────────────────────────────
   Douze semaines en trois blocs de quatre. Chaque bloc garde les mêmes
   exercices pendant trois semaines — sans quoi aucune progression n'est
   mesurable — puis la quatrième semaine décharge, et le bloc suivant
   change les exercices et resserre les répétitions.                    */

const PRESCRIPTION = {
  1:{nom:'Fondation',      d:'Technique et volume modéré. On installe le geste avant la charge.',
     pri:{s:3,r:[10,12],rpe:7,   repos:120}, sec:{s:3,r:[10,12],rpe:7,  repos:90},
     iso:{s:2,r:[12,15],rpe:8,   repos:60},  fin:{s:3,r:[30,40],rpe:8,  repos:45, temps:true}},
  2:{nom:'Développement',  d:'Le volume monte, les charges suivent. Le bloc où l’on prend le plus.',
     pri:{s:4,r:[8,10], rpe:8,   repos:150}, sec:{s:3,r:[10,12],rpe:8,  repos:90},
     iso:{s:3,r:[12,15],rpe:8.5, repos:60},  fin:{s:3,r:[40,50],rpe:8,  repos:45, temps:true}},
  3:{nom:'Intensification',d:'Moins de répétitions, plus lourd. On récolte ce que les deux blocs ont construit.',
     pri:{s:4,r:[6,8],  rpe:8.5, repos:180}, sec:{s:4,r:[8,10], rpe:8,  repos:120},
     iso:{s:3,r:[10,12],rpe:9,   repos:60},  fin:{s:3,r:[45,60],rpe:8,  repos:45, temps:true}}
};
const MODELES = {
  fullA:{n:'Complet A — dominante poussée', k:'force', slots:[
    ['squat','pri'],['pousseeH','pri'],['tirageH','sec'],['charniere','sec'],['epaulesLat','iso'],['triceps','iso'],['gainage','fin']]},
  fullB:{n:'Complet B — dominante tirage', k:'force', slots:[
    ['charniere','pri'],['tirageV','pri'],['pousseeV','sec'],['fente','sec'],['biceps','iso'],['pecIso','iso'],['gainage','fin']]},
  fullC:{n:'Complet C — équilibre', k:'force', slots:[
    ['fente','pri'],['pousseeH','sec'],['tirageH','sec'],['iscIso','iso'],['epaulesLat','iso'],['abdo','fin']]},
  hautA:{n:'Haut du corps A', k:'force', slots:[
    ['pousseeH','pri'],['tirageV','pri'],['pousseeV','sec'],['tirageH','sec'],['epaulesLat','iso'],['biceps','iso'],['triceps','iso']]},
  hautB:{n:'Haut du corps B', k:'force', slots:[
    ['tirageH','pri'],['pousseeH','pri'],['tirageV','sec'],['epaulesLat','iso'],['pecIso','iso'],['biceps','iso'],['triceps','iso']]},
  basA:{n:'Bas du corps A', k:'force', slots:[
    ['squat','pri'],['charniere','sec'],['fente','sec'],['iscIso','iso'],['mollets','iso'],['gainage','fin']]},
  basB:{n:'Bas du corps B', k:'force', slots:[
    ['charniere','pri'],['squat','sec'],['fente','sec'],['quaIso','iso'],['mollets','iso'],['abdo','fin']]},
  push:{n:'Poussée', k:'force', slots:[
    ['pousseeH','pri'],['pousseeV','sec'],['pousseeH','sec'],['epaulesLat','iso'],['pecIso','iso'],['triceps','iso']]},
  pull:{n:'Tirage', k:'force', slots:[
    ['tirageV','pri'],['tirageH','pri'],['tirageH','sec'],['epaulesLat','iso'],['biceps','iso'],['dosIso','iso']]},
  cardio:{n:'Cardio', k:'cardio', slots:[['cardio','pri'],['gainage','fin']]},
  recup:{n:'Récupération active', k:'recup', slots:[['mobilite','sec'],['mobilite','sec'],['sismo','sec']]}
};
/* Répartition de la semaine selon le nombre de jours disponibles. */
function repartition(){
  const n = clamp(S.profil.joursSemaine, 2, 6), db = S.profil.niveau === 'debutant';
  if (n === 2) return ['fullA','fullB'];
  if (n === 3) return db ? ['fullA','fullB','fullC'] : ['hautA','basA','fullB'];
  if (n === 4) return ['hautA','basA','hautB','basB'];
  if (n === 5) return db ? ['fullA','basA','fullB','hautA','fullC'] : ['push','pull','basA','hautB','basB'];
  return ['push','pull','basA','push','pull','basB'];
}
/* Matériel réellement disponible, d'après le lieu et les options ON AIR. */
function materielDispo(){
  const m = new Set(['pdc']);
  if (S.profil.lieux.includes('salle')) ['barre','halteres','machine','poulie','banc','rack','velo','rameur','tapis','elastique','kb'].forEach(x => m.add(x));
  if (S.profil.lieux.includes('maison')) ['halteres','elastique','kb','tapis'].forEach(x => m.add(x));
  if (S.profil.lieux.includes('exterieur')) m.add('tapis');
  if (S.profil.options.water) m.add('piscine');
  if (S.profil.options.sismo) m.add('sismo');
  return m;
}
const NIV_MAX = {debutant:2, intermediaire:3, avance:3};

/* Réservoir d'exercices pour un schéma moteur donné, filtré par le
   matériel, le niveau et les articulations à ménager.                 */
function reservoir(pattern, role){
  const mat = materielDispo(), nvMax = NIV_MAX[S.profil.niveau], ci = S.profil.contraintes;
  let pool = EXOS.filter(e => e.p === pattern
    && e.m.some(x => mat.has(x))
    && e.nv <= nvMax
    && !(e.ci || []).some(c => ci.includes(c)));
  if (!pool.length) pool = EXOS.filter(e => e.p === pattern && e.m.some(x => mat.has(x)) && !(e.ci || []).some(c => ci.includes(c)));
  /* Plus rien ne passe : on relâche la contrainte articulaire, jamais le
     matériel — prescrire un exercice irréalisable ne sert personne. Le
     drapeau « attention » remonte jusqu'à la séance.                    */
  let relache = false;
  if (!pool.length){
    pool = EXOS.filter(e => e.p === pattern && e.m.some(x => mat.has(x)));
    relache = pool.length > 0;
  }
  if (!pool.length) pool = EXOS.filter(e => e.p === pattern && e.m.every(x => x === 'pdc'));
  /* Un exercice principal se veut polyarticulaire et chargeable ; une
     isolation se veut simple et répétable. D'où deux tris opposés.    */
  const tri = pool.sort((a, b) => role === 'pri' ? b.nv - a.nv || a.n.localeCompare(b.n) : a.nv - b.nv || a.n.localeCompare(b.n));
  tri.relache = relache;   /* porté par le réservoir, jamais par l'exercice */
  return tri;
}
function choisirExo(pattern, role, bloc, rang, cle){
  const perso = S.personnalises[`${cle}:${rang}`];
  if (perso && EXO_MAP[perso]) return {e:EXO_MAP[perso], attention:false};
  const pool = reservoir(pattern, role);
  if (!pool.length) return null;
  return {e:pool[(bloc - 1 + rang) % pool.length], attention:pool.relache};
}

const blocDe = sem => clamp(Math.ceil(sem / 4), 1, 3);
const estDecharge = sem => sem % 4 === 0;

/* Construit une séance : exercices, séries, répétitions, repos, durée. */
function construireSeance(modeleCle, sem, dow, date){
  const mod = MODELES[modeleCle], bloc = blocDe(sem), presc = PRESCRIPTION[bloc], dech = estDecharge(sem);
  const cle = `${modeleCle}-b${bloc}`;
  const exercices = [];
  mod.slots.forEach(([pattern, role], rang) => {
    const choix = choisirExo(pattern, role, bloc, rang, cle);
    if (!choix) return;
    let {e, attention} = choix;
    if (exercices.some(x => x.ex === e.i)){                        /* pas deux fois le même exercice */
      const alt = (e.a || []).map(i => EXO_MAP[i]).find(x => x && !exercices.some(y => y.ex === x.i));
      if (!alt) return;
      e = alt;
    }
    exercices.push(prescrire(e, role, presc, dech, pattern, rang, attention));
  });
  /* Une minute de cardio est une minute ; une série de gainage dure ce que
     dit sa consigne ; une série de force, environ quarante secondes plus
     le repos. Trois régimes différents, donc trois calculs.            */
  const dureeDe = liste => Math.round((mod.k === 'force' ? 8 : 5) + liste.reduce((t, x) => {
    if (x.role === 'cardio') return t + x.reps[1];
    const effort = x.temps ? (x.reps[1] || 45) : 40;
    return t + x.series * ((x.repos + effort) / 60);
  }, 0));
  /* On tient le créneau annoncé : d'abord les isolations, puis le
     finisher, puis un secondaire — jamais un exercice principal.      */
  let retires = 0;
  for (const role of ['iso', 'sec']){
    for (const x of exercices)
      if (x.role === role && x.series > 2 && dureeDe(exercices) > S.profil.duree + 6) x.series--;
  }
  for (const role of ['iso', 'fin', 'sec']){
    while (dureeDe(exercices) > S.profil.duree + 6 && exercices.length > 3){
      const i = exercices.map(x => x.role).lastIndexOf(role);
      if (i < 0) break;
      exercices.splice(i, 1); retires++;
    }
  }
  return {cle:`${sem}-${dow}`, modele:modeleCle, semaine:sem, bloc, dow, date,
    type:mod.k, nom:mod.n, decharge:dech, exercices, retires, duree:dureeDe(exercices)};
}
function prescrire(e, role, presc, dech, pattern, rang, attention){
  const p = presc[role];
  let series = p.s, rpe = p.rpe, repos = p.repos;
  if (dech){ series = Math.max(2, Math.ceil(series * 0.6)); rpe = Math.min(rpe, 6.5); }
  if (S.profil.duree <= 50) repos = Math.min(repos, role === 'pri' ? 120 : 75);
  /* Le cardio ne se compte pas en séries mais en minutes de zone. */
  if (pattern === 'cardio' || pattern === 'aqua'){
    const m = metriques(), z = m.zones[1];
    const bas = Math.max(15, S.profil.duree - 20), haut = Math.max(20, S.profil.duree - 15);
    return {ex:e.i, role:'cardio', series:1, reps:[bas, haut],
      rpe:6, repos:0, temps:true, zone:`${z.min}-${z.max} bpm`, rang};
  }
  if (pattern === 'sismo' || pattern === 'mobilite')
    return {ex:e.i, role:'recup', series:2, reps:[40,60], rpe:4, repos:20, temps:true, rang};
  return {ex:e.i, role, series, reps:p.r, rpe, repos, temps:!!p.temps, rang, attention:!!attention};
}

/* La semaine entière : jours d'entraînement, cardio ajouté selon
   l'objectif, et repos explicitement nommé comme tel.                 */
function planSemaine(sem){
  const jours = S.profil.jours.length ? S.profil.jours : ['lun','mer','ven'];
  const modeles = repartition();
  const lundi = plusJours(S.profil.debut, (sem - 1) * 7);
  const obj = OBJECTIFS[S.profil.objectif];
  const ordre = ['lun','mar','mer','jeu','ven','sam','dim'];
  const libres = ordre.filter(d => !jours.includes(d));
  /* Un jour entièrement vide est réservé d'office : sept jours occupés,
     ce n'est plus un programme, c'est une dette de récupération.       */
  const repos = libres.length ? libres[libres.length - 1] : null;
  const candidats = libres.filter(d => d !== repos);
  const cardio = candidats.slice(0, Math.max(0, Math.min(obj.cardio - 1, candidats.length - (S.profil.options.sismo ? 1 : 0))));
  const recup = (S.profil.options.sismo || S.profil.options.water)
    ? candidats.find(d => !cardio.includes(d)) : null;
  const semaine = [];
  let i = 0;
  ordre.forEach((dow, idx) => {
    const date = plusJours(lundi, idx);
    if (jours.includes(dow)) semaine.push(construireSeance(modeles[i++ % modeles.length], sem, dow, date));
    else if (cardio.includes(dow)) semaine.push(construireSeance('cardio', sem, dow, date));
    else if (dow === recup) semaine.push(construireSeance('recup', sem, dow, date));
    else semaine.push({cle:`${sem}-${dow}`, semaine:sem, bloc:blocDe(sem), dow, date, type:'repos',
      nom:'Repos', decharge:estDecharge(sem), exercices:[], duree:0});
  });
  return semaine;
}
/* Le cardio en bassin remplace le vélo dès que l'option Water Sport est
   active : même zone cible, zéro impact sur les articulations.        */
function ajusterCardioAquatique(seance){
  if (!S.profil.options.water || seance.type !== 'cardio') return seance;
  seance.exercices = seance.exercices.map(x => EXO_MAP[x.ex] && EXO_MAP[x.ex].p === 'cardio' ? {...x, ex:'aquabike'} : x);
  return seance;
}
function semaineCourante(){
  if (!S.profil.debut) return 1;
  return clamp(Math.floor(joursEntre(S.profil.debut, aujourdhui()) / 7) + 1, 1, 12);
}
function seancePrevue(dateIso){
  const sem = clamp(Math.floor(joursEntre(S.profil.debut, dateIso) / 7) + 1, 1, 12);
  return planSemaine(sem).map(ajusterCardioAquatique).find(s => s.date === dateIso) || null;
}
/* La séance enregistrée pour une date, si elle existe déjà. */
const seanceEnregistree = d => S.seances.find(s => s.date === d) || null;
</script>

<script>

function rendreOnboarding(){

  </div>

             ['maison','À la maison','Haltères, élastiques, poids du corps'],

function ecrRecap(){
  const sauve = structuredClone(S.profil);
  Object.assign(S.profil, T);
  const m = metriques(), rep = repartition();
  Object.assign(S.profil, sauve);
  const o = OBJECTIFS[T.objectif];
  return `${titreEtape('Voici votre plan', `${T.prenom ? T.prenom + ', v' : 'V'}oilà ce que donnent vos réponses. Tout reste modifiable dans les réglages.`)}
  <div class="grid g2" style="margin-top:20px">
    <div class="stat accent"><div class="k">Calories cibles</div><div class="v">${m.kcal}<span class="u">kcal</span></div><div class="d">dépense estimée ${m.de}</div></div>
    <div class="stat"><div class="k">Protéines</div><div class="v">${m.prot}<span class="u">g</span></div><div class="d">≈ ${m.proteinesParRepas} g par repas</div></div>

function brancherOnboarding(){
  $$('[data-set]').forEach(b => b.addEventListener('click', () => {
    T[b.dataset.set] = b.dataset.num ? parseFloat(b.dataset.val) : b.dataset.val;
    rendreOnboarding();
  }));
  $$('[data-jour]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.jour, i = T.jours.indexOf(k);
    if (i >= 0) T.jours.splice(i, 1); else T.jours.push(k);
    T.jours.sort((a, c) => JOUR_CLE.indexOf(a) - JOUR_CLE.indexOf(c));
    T.joursSemaine = T.jours.length;
    rendreOnboarding();
  }));
  $$('[data-lieu]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.lieu, i = T.lieux.indexOf(k);
    if (i >= 0) T.lieux.splice(i, 1); else T.lieux.push(k);
    rendreOnboarding();
  }));
  $$('[data-opt]').forEach(b => b.addEventListener('click', () => {
    T.options[b.dataset.opt] = !T.options[b.dataset.opt]; rendreOnboarding();
  }));
  $$('[data-ci]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.ci, i = T.contraintes.indexOf(k);
    if (i >= 0) T.contraintes.splice(i, 1); else T.contraintes.push(k);
    rendreOnboarding();
  }));
  const d = $('#p-duree'); if (d) d.addEventListener('input', () => { T.duree = +d.value; $('#duree-v').textContent = d.value + ' min'; });
  const so = $('#p-sommeil'); if (so) so.addEventListener('input', () => { T.sommeilCible = +so.value; $('#som-v').textContent = so.value + ' h'; });
  const info = $('#dispo-info');
  if (info){
    const n = T.jours.length;
    info.textContent = n < 2 ? "Choisissez au moins deux jours : en dessous, aucun programme de force ne tient debout."
      : n === 2 ? "Deux séances complètes par semaine : le minimum qui progresse réellement."
      : n === 3 ? "Trois séances : le meilleur rapport résultats / contraintes."
      : n === 4 ? "Quatre séances : haut et bas du corps, deux fois chacun."
      : "Cinq séances ou plus : découpage poussée / tirage / jambes.";
  }
}
function validerEtape(){
  if (etape === 0){ T.prenom = $('#p-prenom').value.trim(); return true; }
  if (etape === 1){
    T.age = clamp(num($('#p-age').value) || 35, 14, 90);
    T.taille = clamp(num($('#p-taille').value) || 175, 130, 230);
    T.poidsDepart = clamp(num($('#p-poids').value) || 80, 35, 250);
    if (!T.taille || !T.poidsDepart){ toast('Taille et poids sont nécessaires pour les calculs.'); return false; }
    return true;
  }
  if (etape === 4 && T.jours.length < 2){ toast('Choisissez au moins deux jours.'); return false; }
  if (etape === 5 && !T.lieux.length){ toast('Indiquez au moins un lieu d’entraînement.'); return false; }
  return true;
}
function finirOnboarding(){
  T.joursSemaine = T.jours.length;
  /* Le programme démarre au lundi de la semaine en cours. */
  const d = new Date(); const dec = (d.getDay() + 6) % 7;
  T.debut = S.profil.debut || iso(new Date(d.getTime() - dec * 864e5));
  T.cree = S.profil.cree || new Date().toISOString();
  S.profil = structuredClone(T);
  if (!S.mesures.some(m => m.date === aujourdhui()))
    S.mesures.push({date:aujourdhui(), poids:T.poidsDepart, note:'Point de départ'});
  sauver();
  demarrerApp();
  aller('jour');
  toast('Programme créé. Bonne première séance.');
}
</script>

<script>
"use strict";
/* ─── 7. Vue « Aujourd'hui » ─────────────────────────────────────────── */
function rendreJour(){
  const m = metriques(), sem = semaineCourante(), bloc = blocDe(sem), dech = estDecharge(sem);
  const prevue = seancePrevue(aujourdhui()), faite = seanceEnregistree(aujourdhui());
  const c = checkinDuJour(), score = scoreForme(c), cons = consigneForme(score);
  const t = tendancePoids(), pl = poidsLisse();

  $('#v-jour').innerHTML = `
  <div style="padding:14px 0 4px">
    <p class="tiny muted">${cap(dateLongue(aujourdhui()))}</p>

  ${c ? `
  <div class="card" style="margin-top:16px">
    <div class="card-h"><h3>Forme du jour</h3><span class="badge ${cons.cls}">${cons.t}</span></div>
    <div style="display:flex;gap:18px;align-items:center">

      <div style="flex:1;min-width:0">

  <button class="card" id="j-checkin" style="margin-top:16px;width:100%;text-align:left;display:flex;gap:13px;align-items:center;cursor:pointer">

    <div style="flex:1"><b style="font-size:14.5px;display:block">Le point du matin</b>
      <span class="tiny muted">Cinq curseurs, vingt secondes. C'est ce qui permet à la séance du jour de s'ajuster à votre état réel.</span></div>
  </button>`}

  ${rendreCarteSeance(prevue, faite)}

  <div class="sec-title">En un coup d’œil</div>
  <div class="grid g2">
    <div class="stat"><div class="k">Poids lissé</div>
      <div class="v">${pl !== null ? rnd(pl,1) : rnd(m.poids,1)}<span class="u">kg</span></div>
      <div class="d">${t !== null ? delta(t,' kg', S.profil.objectif !== 'muscle') + ' sur 7 jours' : 'moyenne sur 7 jours'}</div></div>
    <div class="stat accent"><div class="k">Séances / 7 jours</div>
      <div class="v">${cetteSemaine}<span class="u">/ ${S.profil.joursSemaine}</span></div>
      <div class="d">${cetteSemaine >= S.profil.joursSemaine ? 'objectif atteint' : `encore ${S.profil.joursSemaine - cetteSemaine}`}</div></div>
    <div class="stat"><div class="k">Série en cours</div>
      <div class="v">${serieAssiduite()}<span class="u">sem.</span></div><div class="d">sans semaine blanche</div></div>
    <div class="stat cardio"><div class="k">Tonnage 7 jours</div>
      <div class="v">${Math.round(S.seances.filter(s => s.termine && joursEntre(s.date,aujourdhui()) < 7).reduce((a,s)=>a+tonnage(s),0)/1000)}<span class="u">t</span></div>
      <div class="d">charge × répétitions</div></div>
  </div>

  ${rappelVisbody()}

  <div class="sec-title">Le coach vous dit</div>
  ${ajustements().slice(0,3).map(a => `<div class="note ${a.cls}"><b>${a.t}.</b> ${a.d}</div>`).join('')}
  <button class="btn ghost" style="width:100%;margin-top:6px" data-go="suivi">Voir tout le suivi</button>
  <div style="height:8px"></div>`;

  const dansJour = s => $('#v-jour ' + s);
  dansJour('#j-checkin')?.addEventListener('click', modalCheckin);
  dansJour('#j-refaire')?.addEventListener('click', modalCheckin);
  dansJour('#j-demarrer')?.addEventListener('click', () => { demarrerSeance(aujourdhui()); aller('seance'); });
  dansJour('#j-voir')?.addEventListener('click', () => aller('seance'));
  $$('#v-jour [data-go]').forEach(b => b.addEventListener('click', () => aller(b.dataset.go)));
}
function rendreCarteSeance(prevue, faite){
  if (!prevue) return '';
  if (prevue.type === 'repos' && !faite) return `
    <div class="card" style="margin-top:14px;text-align:center;padding:26px 18px">
      <div style="font-size:26px;opacity:.5;margin-bottom:8px">◦</div>
      <b style="font-family:var(--display);font-size:16px">Repos programmé</b>
      <p class="tiny muted" style="margin:6px auto 14px;max-width:320px">La progression se fabrique pendant la récupération, pas pendant la séance. Marchez, dormez, mangez vos protéines.</p>
      <button class="btn sm ghost" id="j-voir">Faire quand même une séance</button>
    </div>`;
  const termine = faite && faite.termine;
  const encours = faite && !faite.termine;
  const kind = prevue.type === 'force' ? 'force' : prevue.type === 'cardio' ? 'cardio' : 'recup';
  return `
  <div class="card" style="margin-top:14px;position:relative;overflow:hidden">

    <div class="card-h" style="margin-bottom:10px">
      <span class="badge ${kind}"><i class="dot"></i>${prevue.type === 'force' ? 'Force' : prevue.type === 'cardio' ? 'Cardio' : 'Récupération'}</span>
      ${prevue.decharge ? '<span class="badge warn">Décharge</span>' : ''}

    </div>
    <h3 style="font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.02em">${prevue.nom}</h3>
    <p class="tiny muted" style="margin-top:4px">${prevue.exercices.length} exercices · ${prevue.exercices.reduce((a,x)=>a+x.series,0)} séries · ${PRESCRIPTION[prevue.bloc].nom}</p>
    ${prevue.retires ? `<p class="tiny" style="color:var(--warn);margin-top:6px">${prevue.retires} isolation${prevue.retires>1?'s':''} retirée${prevue.retires>1?'s':''} pour tenir dans vos ${S.profil.duree} minutes.</p>` : ''}
    <div class="scroll-x" style="margin:14px -18px 4px;padding:2px 18px 6px">
      ${prevue.exercices.map(x => `<span class="badge">${esc(EXO_MAP[x.ex]?.n || x.ex)}</span>`).join('')}
    </div>
    ${termine ? `<div class="note" style="margin:12px 0 0"><b>Séance terminée.</b> ${Math.round(tonnage(faite)).toLocaleString('fr-FR')} kg déplacés${faite.duree ? ` en ${fmtDuree(faite.duree)}` : ''}.</div>
      <button class="btn ghost lg" id="j-voir" style="margin-top:12px">Revoir la séance</button>`
    : `<button class="btn pri lg" id="${encours ? 'j-voir' : 'j-demarrer'}" style="margin-top:14px">
        ${encours ? 'Reprendre la séance' : 'Démarrer la séance'}</button>`}
  </div>`;
}
/* Nombre de semaines consécutives avec au moins une séance. */
function serieAssiduite(){
  let n = 0;
  for (let k = 0; k < 60; k++){
    const fin = plusJours(aujourdhui(), -7 * k), debut = plusJours(fin, -6);
    const ok = S.seances.some(s => s.termine && s.date >= debut && s.date <= fin);
    if (!ok){ if (k === 0) continue; break; }
    n++;
  }
  return n;
}
/* Le scan Visbody n'a d'intérêt que comparé au précédent : on le
   rappelle toutes les quatre semaines, calé sur les blocs.            */
function rappelVisbody(){
  if (!S.profil.options.visbody && !S.profil.options.sismo) return '';
  const dernier = [...S.mesures].filter(m => m.mg > 0).sort((a,b) => a.date < b.date ? 1 : -1)[0];
  const depuis = dernier ? joursEntre(dernier.date, aujourdhui()) : joursEntre(S.profil.debut, aujourdhui());
  if (depuis < 26) return '';
  return `<div class="note warn" style="margin-top:14px"><b>Scan Visbody à refaire.</b>
    ${dernier ? `Le dernier date d'il y a ${depuis} jours.` : 'Aucun scan enregistré pour l’instant.'}
    Le poids seul ne dit pas si vous perdez du gras ou du muscle — le scan, si. Refaites-le dans les mêmes conditions : à jeun, le matin, avant de boire.</div>`;
}

/* Point du matin. */
function modalCheckin(){
  const c = checkinDuJour() || {sommeil:3, energie:3, courbatures:3, stress:3, motivation:3, heures:S.profil.sommeilCible};
  const curseur = (k, label, bas, haut) => `
    <div class="field"><div class="rng-h"><label style="margin:0">${label}</label><b id="ck-${k}-v">${['','très bas','bas','moyen','bon','excellent'][c[k]]}</b></div>
    <input class="rng" id="ck-${k}" type="range" min="1" max="5" step="1" value="${c[k]}">
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)"><span>${bas}</span><span>${haut}</span></div></div>`;
  ouvrirModal(`
    <div class="modal-h"><h3>Le point du matin</h3><button class="icon-btn" data-fermer>✕</button></div>
    <p class="tiny muted" style="margin-bottom:16px">Répondez d'instinct. Le score qui en sort décide si la séance du jour se fait complète, allégée, ou remplacée.</p>
    <div class="field"><div class="rng-h"><label style="margin:0">Heures de sommeil</label><b id="ck-heures-v">${c.heures} h</b></div>
      <input class="rng" id="ck-heures" type="range" min="3" max="11" step="0.5" value="${c.heures}"></div>
    ${curseur('sommeil','Qualité du sommeil','agité','réparateur')}
    ${curseur('energie','Énergie','vidé','plein')}
    ${curseur('courbatures','Courbatures','aucune','sévères')}
    ${curseur('stress','Stress','serein','tendu')}
    ${curseur('motivation','Envie de bouger','nulle','forte')}
    <button class="btn pri lg" id="ck-ok" style="margin-top:8px">Enregistrer</button>`);
  ['sommeil','energie','courbatures','stress','motivation'].forEach(k => {
    const el = $('#ck-' + k);
    el.addEventListener('input', () => $(`#ck-${k}-v`).textContent = ['','très bas','bas','moyen','bon','excellent'][el.value]);
  });
  $('#ck-heures').addEventListener('input', e => $('#ck-heures-v').textContent = e.target.value + ' h');
  $('#ck-ok').addEventListener('click', () => {
    const v = {date:aujourdhui(), heures:num($('#ck-heures').value)};
    ['sommeil','energie','courbatures','stress','motivation'].forEach(k => v[k] = num($('#ck-' + k).value));
    const i = S.checkins.findIndex(x => x.date === v.date);
    if (i >= 0) S.checkins[i] = v; else S.checkins.push(v);
    S.checkins.sort((a,b) => a.date < b.date ? -1 : 1);
    sauver(); fermerModal(); rendreJour();
    const s = scoreForme(v);
    toast(`Forme du jour : ${s} / 100 — ${consigneForme(s).t.toLowerCase()}`);
  });
}
</script>

<script>
"use strict";
/* ─── 8. Vue « Programme » ───────────────────────────────────────────── */
let semaineVue = null;
function rendreProgramme(){
  const sem = semaineVue ?? semaineCourante(), bloc = blocDe(sem), presc = PRESCRIPTION[bloc];
  const semaine = planSemaine(sem).map(ajusterCardioAquatique);
  const lundi = plusJours(S.profil.debut, (sem - 1) * 7);
  const faites = semaine.filter(s => { const e = seanceEnregistree(s.date); return e && e.termine; }).length;
  const aFaire = semaine.filter(s => s.type !== 'repos').length;

  $('#v-programme').innerHTML = `
  <div style="padding:14px 0 2px">
    <h2 class="hero-h">Programme</h2>
    <p class="lead" style="margin-top:6px">Douze semaines, trois blocs. Les exercices ne changent qu'entre les blocs : c'est ce qui rend la progression lisible.</p>
  </div>
  <div class="scroll-x" style="margin-top:16px">
    ${Array.from({length:12}, (_, i) => {
      const s = i + 1, d = estDecharge(s), act = s === sem, cour = s === semaineCourante();
      return `<button class="chip ${act?'on':''}" data-sem="${s}" style="flex:none;min-width:52px;flex-direction:column;gap:1px;padding:8px 10px">
        <span style="font-size:14px;font-weight:800;font-family:var(--display)">${s}</span>
        <span style="font-size:9px;opacity:.75;letter-spacing:.04em">${d ? 'DÉCH.' : cour ? 'EN COURS' : 'SEM.'}</span></button>`;
    }).join('')}
  </div>
  <div class="card">
    <div class="card-h"><h3>Bloc ${bloc} — ${presc.nom}</h3>
      <span class="badge ${estDecharge(sem)?'warn':'accent'}">${estDecharge(sem)?'Décharge':'Semaine ' + ((sem-1)%4+1) + ' / 4'}</span></div>
    <p class="tiny" style="color:var(--text2)">${presc.d}</p>
    ${estDecharge(sem) ? `<div class="note warn" style="margin-bottom:0"><b>Semaine allégée.</b> Le volume tombe de 40 %, les charges restent. C'est la semaine où les articulations et le système nerveux rattrapent le muscle — la sauter est le meilleur moyen de stagner au bloc suivant.</div>`
      : `<div class="grid g3" style="margin-top:14px">
        ${['pri','sec','iso'].map(r => `<div class="stat" style="padding:11px 12px">
          <div class="k">${{pri:'Principaux',sec:'Secondaires',iso:'Isolation'}[r]}</div>
          <div class="v num" style="font-size:17px">${presc[r].s}×${presc[r].r[0]}-${presc[r].r[1]}</div>
          <div class="d">RPE ${presc[r].rpe} · ${presc[r].repos}s</div></div>`).join('')}
      </div>`}
    <div class="split" style="margin-top:12px"><span class="sl">Progression de la semaine</span>
      <span class="sv">${faites} / ${aFaire}</span></div>
    ${barre(aFaire ? faites/aFaire : 0)}
  </div>
  <div class="sec-title">Du ${dateCourte(lundi)} au ${dateCourte(plusJours(lundi,6))}</div>
  ${semaine.map(s => {
    const e = seanceEnregistree(s.date), fait = e && e.termine, cejour = s.date === aujourdhui();
    const d = dateDe(s.date);
    const kind = s.type === 'force' ? 'force' : s.type === 'cardio' ? 'cardio' : s.type === 'recup' ? 'recup' : 'repos';
    return `<button class="day ${cejour?'today':''} ${fait?'done':''}" data-date="${s.date}" ${s.type==='repos'?'disabled style="cursor:default;opacity:.7"':''}>
      <div class="day-k ${kind}"></div>
      <div class="day-d"><b>${d.getDate()}</b><span>${JOURS[(d.getDay()+6)%7][1].slice(0,3)}</span></div>
      <div class="day-t"><b>${s.nom}</b><span>${s.type === 'repos' ? 'Récupération complète'
        : `${s.exercices.length} exercices · ${fmtDuree(s.duree)}`}</span></div>
      ${fait ? '<span class="badge accent">✓</span>' : cejour && s.type !== 'repos' ? '<span class="badge accent">Aujourd’hui</span>' : ''}
    </button>`;
  }).join('')}
  <div class="note"><b>Une séance manquée ne se rattrape pas, elle se remplace.</b> Prenez la séance suivante du programme à la place : décaler d'un jour vaut mieux que doubler le lendemain.</div>`;

  $$('#v-programme [data-sem]').forEach(b => b.addEventListener('click', () => { semaineVue = +b.dataset.sem; rendreProgramme(); }));
  $$('#v-programme .day[data-date]').forEach(b => b.addEventListener('click', () => apercuSeance(b.dataset.date)));
}

/* Aperçu d'une séance : le détail avant de s'engager. */
function apercuSeance(dateIso){
  const s = seancePrevue(dateIso); if (!s || s.type === 'repos') return;
  const e = seanceEnregistree(dateIso), fait = e && e.termine;
  ouvrirModal(`
    <div class="modal-h"><h3>${s.nom}</h3><button class="icon-btn" data-fermer>✕</button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      <span class="badge">${dateLongue(dateIso)}</span>
      <span class="badge">${fmtDuree(s.duree)}</span>

          <span>${x.temps ? `${x.series} × ${x.reps[0]}-${x.reps[1]} s` : `${x.series} × ${x.reps[0]}-${x.reps[1]} reps`} · RPE ${x.rpe}${x.repos?` · repos ${x.repos}s`:''}${x.zone?` · ${x.zone}`:''}</span></div>

<script>
"use strict";
/* ─── 9. Vue « Séance » : le carnet d'entraînement ────────────────────
   Le principe : proposer une charge argumentée pour chaque série, puis
   n'enregistrer que ce qui a réellement été fait.                      */
let exoOuvert = 0;

function demarrerSeance(dateIso, aujourdHui=false){
  const d = aujourdHui ? aujourdhui() : dateIso;
  const dejaLa = seanceEnregistree(d);
  if (dejaLa) return dejaLa;
  const plan = seancePrevue(dateIso);
  if (!plan || plan.type === 'repos'){ toast('Aucune séance programmée ce jour.'); return null; }
  const cons = consigneForme(scoreForme(checkinDuJour()));
  const s = {
    id:'s' + Date.now(), date:d, cle:plan.cle, modele:plan.modele, semaine:plan.semaine, bloc:plan.bloc,
    nom:plan.nom, type:plan.type, decharge:plan.decharge, debutTs:Date.now(), duree:0,
    termine:false, rpeGlobal:0, notes:'', formeAuDepart:scoreForme(checkinDuJour()),
    exercices: plan.exercices.map(x => {
      const nb = Math.max(1, Math.round(x.series * cons.f));
      const prop = x.temps ? null : chargeProposee(x.ex, x.reps[1], x.rpe);
      const series = [];
      /* Échauffement : deux séries montantes sur les exercices lourds. */
      if (S.reglages.seriesEchauffement && x.role === 'pri' && prop && prop.kg > 20){
        series.push({reps:8, charge:arrondiCharge(prop.kg * 0.5), rpe:4, fait:false, echauffement:true});
        series.push({reps:4, charge:arrondiCharge(prop.kg * 0.75), rpe:5, fait:false, echauffement:true});
      }
      for (let i = 0; i < nb; i++)
        series.push({reps:x.reps[1], charge:prop ? prop.kg : 0, rpe:x.rpe, fait:false, echauffement:false});
      return {ex:x.ex, role:x.role, repsCible:x.reps, rpe:x.rpe, repos:x.repos, temps:!!x.temps,
        zone:x.zone || '', attention:!!x.attention, motif:prop ? prop.motif : 'premiere', series};
    })
  };
  S.seances.push(s); S.seances.sort((a,b) => a.date < b.date ? -1 : 1);
  sauver(); exoOuvert = 0;
  return s;
}
const seanceActive = () => S.seances.find(s => s.date === aujourdhui()) || null;

function rendreSeance(){
  const s = seanceActive();
  const v = $('#v-seance');
  if (!s){
    const prevue = seancePrevue(aujourdhui());
    v.innerHTML = `
      <div style="padding:14px 0"><h2 class="hero-h">Séance</h2></div>
      ${prevue && prevue.type !== 'repos'
        ? rendreCarteSeance(prevue, null)
        : `<div class="empty card"><div class="ei">◦</div><b>Pas de séance aujourd'hui</b>
           <p>C'est un jour de repos au programme. Vous pouvez tout de même lancer une séance libre.</p></div>`}
      <button class="btn ghost lg" id="s-libre" style="margin-top:12px">Séance libre</button>`;
    $('#v-seance #j-demarrer')?.addEventListener('click', () => { demarrerSeance(aujourdhui()); rendreSeance(); });
    $('#v-seance #j-voir')?.addEventListener('click', () => rendreSeance());
    $('#s-libre').addEventListener('click', modalSeanceLibre);
    return;
  }
  const total = s.exercices.reduce((a,x) => a + x.series.filter(y => !y.echauffement).length, 0);
  const faites = s.exercices.reduce((a,x) => a + x.series.filter(y => y.fait && !y.echauffement).length, 0);
  const min = Math.round((Date.now() - s.debutTs) / 60000);

  v.innerHTML = `
  <div style="padding:14px 0 2px">
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
      <span class="badge ${s.type === 'force' ? 'force' : s.type === 'cardio' ? 'cardio' : 'recup'}"><i class="dot"></i>${s.nom}</span>
      ${s.decharge ? '<span class="badge warn">Décharge</span>' : ''}
      ${s.termine ? '<span class="badge accent">Terminée</span>' : `<span class="badge">${min} min</span>`}
    </div>
    <div style="display:flex;align-items:baseline;gap:8px">
      <h2 class="hero-h">${faites}<span style="color:var(--muted);font-size:.55em"> / ${total} séries</span></h2>
      <span class="tiny muted" style="margin-left:auto">${Math.round(tonnage(s)).toLocaleString('fr-FR')} kg</span>
    </div>
    <div style="margin-top:10px">${barre(total ? faites/total : 0)}</div>
  </div>
  <div style="margin-top:18px">
    ${s.exercices.map((x, i) => rendreExo(x, i, s)).join('')}
  </div>
  ${s.termine ? `
    <div class="card"><div class="card-h"><h3>Bilan</h3></div>
      <div class="split"><span class="sl">Durée</span><span class="sv">${fmtDuree(s.duree)}</span></div>
      <div class="split"><span class="sl">Tonnage</span><span class="sv">${Math.round(tonnage(s)).toLocaleString('fr-FR')} kg</span></div>
      <div class="split"><span class="sl">Difficulté ressentie</span><span class="sv">RPE ${s.rpeGlobal || '—'}</span></div>
      ${s.notes ? `<div class="note" style="margin-bottom:0">${esc(s.notes)}</div>` : ''}</div>`
  : `<div class="btn-row" style="margin-top:6px">
      <button class="btn ghost" id="s-ajouter" style="flex:1">Ajouter un exercice</button>
      <button class="btn pri" id="s-finir" style="flex:1">Terminer</button>
    </div>
    <button class="btn ghost danger sm" id="s-annuler" style="width:100%;margin-top:10px">Annuler cette séance</button>`}
  <div style="height:10px"></div>`;

  brancherSeance(s);
}
function rendreExo(x, i, s){
  const ex = EXO_MAP[x.ex]; if (!ex) return '';
  const dures = x.series.filter(y => !y.echauffement);
  const fini = dures.length && dures.every(y => y.fait);
  const ouvert = i === exoOuvert;
  const der = derniereSerie(x.ex);
  const motifs = {montée:'Charge montée : la dernière fois, la série est passée au sommet de la fourchette sans dépasser le RPE cible.',
    'répéter':"Même charge : validez d'abord le haut de la fourchette avec un RPE conforme.",
    'compléter':"Même charge : il reste des répétitions à gagner avant de monter.",
    premiere:"Première fois sur cet exercice : cherchez la charge où la dernière répétition est difficile mais encore propre."};
  return `
  <div class="exo ${fini?'done':''} ${ouvert?'open':''}" data-exo="${i}">
    <div class="exo-h" data-toggle="${i}">
      <div class="exo-n">${fini ? '✓' : i+1}</div>
      <div class="exo-t"><b>${esc(ex.n)}</b>
        <span>${x.temps ? `${x.series?.length ?? dures.length} × ${x.repsCible[0]}-${x.repsCible[1]} s` : `${dures.length} × ${x.repsCible[0]}-${x.repsCible[1]}`} · RPE ${x.rpe}${x.zone ? ' · ' + x.zone : ''}</span></div>
      <svg class="exo-c" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="exo-b">
      <div class="exo-note"><b>${{pri:'Exercice principal',sec:'Exercice secondaire',iso:'Isolation',fin:'Finisher',cardio:'Cardio',recup:'Récupération'}[x.role] || 'Exercice'}.</b>
        ${motifs[x.motif] || ''} ${der ? `Dernière fois le ${dateCourte(der.date)} : ${der.series.map(y => `${y.charge}×${y.reps}`).join(', ')}.` : ''}</div>
      ${x.attention ? `<div class="note warn" style="margin:0 0 12px"><b>Aucun repli sans contrainte pour ce créneau.</b>
        Cet exercice touche une articulation que vous avez signalée : réduisez d'abord l'amplitude et la charge, ou remplacez-le ci-dessous.</div>` : ''}

function brancherSeance(s){
