let timerId = null, timerFin = 0, timerTotal = 0;
function lancerTimer(sec, label){
  timerTotal = sec; timerFin = Date.now() + sec * 1000;
  $('#timer').classList.add('on'); $('#timer-l').textContent = 'Repos — ' + label;
  clearInterval(timerId);
  timerId = setInterval(tickTimer, 200); tickTimer();
}
function tickTimer(){
  const reste = Math.max(0, Math.round((timerFin - Date.now()) / 1000));
  $('#timer-v').textContent = `${Math.floor(reste/60)}:${String(reste%60).padStart(2,'0')}`;
  $('#timer-b').style.width = (reste / timerTotal * 100) + '%';
  if (reste <= 0){ arreterTimer(); bip(); }
}
function arreterTimer(){ clearInterval(timerId); timerId = null; $('#timer').classList.remove('on'); }
/* Signal sonore synthétisé : aucun fichier à charger. */
function bip(){
  if (!S.reglages.sonTimer) return;
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .18].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(.0001, ctx.currentTime + t);
      g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + t + .14);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + .16);
    });
    if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    setTimeout(() => ctx.close(), 800);
  }catch(e){ /* le navigateur refuse le son sans interaction : sans conséquence */ }
}

<script>
"use strict";
/* ─── 10. Graphiques (SVG, sans bibliothèque) ─────────────────────────── */
function courbe(series, opts={}){
  const L = 44, R = 10, H = opts.h || 170, T = 12, B = 26;
  const W = 340;                                   /* repère interne, mis à l'échelle par viewBox */
  const pts = series.flatMap(s => s.d);
  if (!series.some(s => s.d.length >= 2)) return `<div class="empty"><div class="ei">◔</div><b>Pas encore de courbe</b><p>${opts.vide || 'Il faut au moins deux points pour tracer une tendance.'}</p></div>`;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  const marge = (y1 - y0) * 0.15 || Math.max(1, y1 * 0.05);
  y0 -= marge; y1 += marge;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = v => L + (x1 === x0 ? 0 : (v - x0) / (x1 - x0)) * (W - L - R);
  const Y = v => T + (1 - (v - y0) / (y1 - y0 || 1)) * (H - T - B);
  const ticks = 4;
  const grille = Array.from({length:ticks+1}, (_, i) => {
    const v = y0 + (y1 - y0) * i / ticks, y = Y(v);
    return `<line class="grid-l" x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}"/>
      <text class="axis" x="${L-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${rnd(v, v > 50 ? 0 : 1)}</text>`;
  }).join('');
  const corps = series.map(s => {
    const d = s.d.slice().sort((a,b) => a.x - b.x);
    const chemin = d.map((p, i) => `${i ? 'L' : 'M'}${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
    const aire = s.aire ? `<path class="area" fill="${s.c}" d="${chemin} L${X(d[d.length-1].x).toFixed(1)} ${H-B} L${X(d[0].x).toFixed(1)} ${H-B} Z"/>` : '';
    const points = s.pts !== false && d.length <= 40
      ? d.map(p => `<circle class="pt" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="${s.c}"/>`).join('') : '';
    return `${aire}<path class="ln" stroke="${s.c}" ${s.tirets ? 'stroke-dasharray="5 4"' : ''} d="${chemin}"/>${points}`;
  }).join('');
  const labels = (opts.x || []).map(t => `<text class="axis" x="${X(t.x).toFixed(1)}" y="${H-8}" text-anchor="middle">${t.n}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.alt || 'Graphique')}">${grille}${corps}${labels}</svg>
    ${series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>` : ''}`;
}
function barres(data, opts={}){
  const L = 30, R = 6, H = opts.h || 150, T = 10, B = 24, W = 340;
  if (!data.length) return '';
  const y1 = Math.max(...data.map(d => Math.max(d.v, d.cible || 0)), 1) * 1.12;
  const bw = (W - L - R) / data.length;
  const Y = v => T + (1 - v / y1) * (H - T - B);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.alt||'Barres')}">
    ${[0, .5, 1].map(f => `<line class="grid-l" x1="${L}" y1="${Y(y1*f).toFixed(1)}" x2="${W-R}" y2="${Y(y1*f).toFixed(1)}"/>
      <text class="axis" x="${L-5}" y="${(Y(y1*f)+3.5).toFixed(1)}" text-anchor="end">${Math.round(y1*f)}</text>`).join('')}
    ${data.map((d, i) => {
      const x = L + i * bw + bw * .18, w = bw * .64, y = Y(d.v), h = Math.max(3, H - B - y);
      const cible = d.cible ? `<line x1="${(x-1).toFixed(1)}" y1="${Y(d.cible).toFixed(1)}" x2="${(x+w+1).toFixed(1)}" y2="${Y(d.cible).toFixed(1)}"
        stroke="var(--muted)" stroke-width="1.8" stroke-dasharray="4 3"/>` : '';
      return `<rect class="br" x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${d.c || 'var(--accent)'}"/>
        ${cible}<text class="axis" x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${esc(d.n)}</text>`;
    }).join('')}</svg>`;
}

    <div class="note" style="margin-bottom:0"><b>Ne regardez que la ligne pleine.</b> La pesée quotidienne varie de plus d'un kilo selon le sel, l'eau et le transit ; seule la moyenne sur sept jours dit quelque chose.</div>
  </div>
  ${taille.length > 1 ? `<div class="card"><div class="card-h"><h3>Tour de taille</h3><span class="sub">${rnd(taille[taille.length-1].tourTaille - taille[0].tourTaille,1)} cm depuis le début</span></div>
    ${courbe([{n:'Tour de taille', d:taille.map(x => ({x:joursEntre(taille[0].date, x.date), y:x.tourTaille})), c:'var(--cardio)', aire:true}], {h:140})}
    <p class="tiny muted">Quand le poids stagne mais que le tour de taille descend, la recomposition fonctionne : vous échangez du gras contre du muscle.</p></div>` : ''}
  ${mgs.length > 1 ? `<div class="card"><div class="card-h"><h3>Composition corporelle</h3><span class="sub">Visbody</span></div>
    ${courbe([
      {n:'Masse grasse (kg)', d:mgs.map(x => ({x:joursEntre(mgs[0].date, x.date), y:rnd(x.poids*x.mg/100,1)})), c:'var(--force)'},
      {n:'Masse maigre (kg)', d:mgs.map(x => ({x:joursEntre(mgs[0].date, x.date), y:rnd(x.poids*(1-x.mg/100),1)})), c:'var(--accent)'}
    ], {h:160})}</div>` : ''}

  <div class="sec-title">Historique des mesures</div>
  ${S.mesures.length ? [...S.mesures].sort((a,b) => a.date < b.date ? 1 : -1).slice(0, 25).map(x => `
    <button class="day" data-mes="${x.date}"><div class="day-k"></div>
      <div class="day-d"><b>${dateDe(x.date).getDate()}</b><span>${MOIS_COURT[dateDe(x.date).getMonth()].replace('.','')}</span></div>
      <div class="day-t"><b>${x.poids ? rnd(x.poids,1) + ' kg' : '—'}</b>
        <span>${[x.tourTaille?`taille ${x.tourTaille} cm`:'', x.mg?`${x.mg} % de gras`:'', x.note?esc(x.note):''].filter(Boolean).join(' · ') || 'poids seul'}</span></div>
    </button>`).join('') : '<div class="empty card"><b>Aucune mesure</b><p>La première pesée est le point zéro de tout le reste.</p></div>'}`;
}
function suiviForce(){
  const prs = Object.entries(S.prs).sort((a,b) => b[1].e1rm - a[1].e1rm);
  const v = volumeSemaine();
  const data = Object.entries(CIBLE_VOLUME).map(([g, [min, max]]) => ({
    n:GROUPES[g].n.slice(0,3), v:v[g] || 0, cible:min,
    c:(v[g]||0) >= min ? 'var(--accent)' : (v[g]||0) > 0 ? 'var(--warn)' : 'var(--line2)'
  }));
  const seances = S.seances.filter(s => s.termine);
  const parSemaine = {};
  seances.forEach(s => { parSemaine[s.semaine] = (parSemaine[s.semaine] || 0) + tonnage(s); });
  const tonnages = Object.entries(parSemaine).map(([k, val]) => ({x:+k, y:Math.round(val/1000*10)/10}));
  return `
  <div class="card">
    <div class="card-h"><h3>Volume de la semaine</h3><span class="sub">séries dures par groupe</span></div>
    ${barres(data, {alt:'Séries par groupe musculaire'})}
    <p class="tiny muted" style="margin-top:8px">Le trait pointillé est le plancher utile : en dessous, le groupe entretient sans progresser. Le plafond raisonnable est environ le double.</p>
  </div>
  ${tonnages.length > 1 ? `<div class="card"><div class="card-h"><h3>Tonnage par semaine</h3><span class="sub">tonnes déplacées</span></div>
    ${courbe([{n:'Tonnage', d:tonnages, c:'var(--cardio)', aire:true}], {h:150,
      x:[{x:tonnages[0].x, n:'S'+tonnages[0].x}, {x:tonnages[tonnages.length-1].x, n:'S'+tonnages[tonnages.length-1].x}]})}
    <p class="tiny muted">Le tonnage baisse volontairement en semaine de décharge : c'est le signe que le programme est suivi, pas un recul.</p></div>` : ''}
  <div class="sec-title">Vos records</div>
  ${prs.length ? prs.map(([id, pr]) => {
    const e = EXO_MAP[id]; if (!e) return '';
    return `<button class="lib-i" data-pr="${id}">
      <div class="lib-g" style="color:var(--${GROUPES[e.g].c})">${GROUPES[e.g].n[0]}</div>
      <div class="lib-t"><b>${esc(e.n)}</b><span>${pr.charge} kg × ${pr.reps} · le ${dateCourte(pr.date)}</span></div>
      <div style="text-align:right"><div class="num" style="font-weight:800;font-size:16px;color:var(--accent)">${rnd(pr.e1rm,1)}</div>
        <div class="tiny muted" style="font-size:10px">1RM est.</div></div>
    </button>`;
  }).join('') : '<div class="empty card"><div class="ei">▲</div><b>Aucun record</b><p>Ils apparaissent dès la première séance enregistrée, et se mettent à jour tout seuls.</p></div>'}
  <div class="note"><b>Le 1RM estimé (formule d’Epley)</b> convertit n’importe quelle série en charge maximale théorique : 60 kg × 10 répétitions valent 80 kg × 1. C’est ce qui permet de comparer une série de 12 à une série de 5.</div>`;
}
function suiviAssiduite(){
  const debut = plusJours(aujourdhui(), -83);            /* douze semaines */
  const cells = Array.from({length:84}, (_, i) => {
    const d = plusJours(debut, i);
    const s = S.seances.find(x => x.date === d && x.termine);
    const n = s ? (s.type === 'force' ? (tonnage(s) > 8000 ? 3 : 2) : 1) : 0;
    return `<i class="${n ? 'l'+n : ''} ${d === aujourdhui() ? 'today' : ''}" title="${d}"></i>`;
  });
  const total = S.seances.filter(s => s.termine).length;
  const heures = Math.round(S.seances.filter(s => s.termine).reduce((a,s) => a + (s.duree||0), 0) / 60);
  const tonnageTotal = S.seances.filter(s => s.termine).reduce((a,s) => a + tonnage(s), 0);
  return `
  <div class="grid g3">
    <div class="stat accent"><div class="k">Séances</div><div class="v">${total}</div><div class="d">depuis le début</div></div>
    <div class="stat"><div class="k">Temps</div><div class="v">${heures}<span class="u">h</span></div><div class="d">sous la barre</div></div>
    <div class="stat cardio"><div class="k">Déplacé</div><div class="v">${Math.round(tonnageTotal/1000)}<span class="u">t</span></div><div class="d">au total</div></div>
  </div>
  <div class="card" style="margin-top:14px">
    <div class="card-h"><h3>Douze dernières semaines</h3><span class="sub">${serieAssiduite()} sem. de suite</span></div>
    <div class="dow">${['L','M','M','J','V','S','D'].map(d => `<span>${d}</span>`).join('')}</div>
    <div class="heat">${cells.join('')}</div>
    <div class="legend"><span><i style="background:var(--sunk);border:1px solid var(--line)"></i>rien</span>
      <span><i style="background:color-mix(in srgb,var(--accent) 28%,var(--sunk))"></i>cardio / récupération</span>
      <span><i style="background:var(--accent)"></i>force</span></div>
  </div>
  <div class="sec-title">Séances enregistrées</div>
  ${S.seances.filter(s => s.termine).length ? [...S.seances].filter(s => s.termine).reverse().slice(0, 30).map(s => `
    <button class="day" data-seance="${s.id}">
      <div class="day-k ${s.type === 'force' ? 'force' : s.type === 'cardio' ? 'cardio' : 'recup'}"></div>
      <div class="day-d"><b>${dateDe(s.date).getDate()}</b><span>${MOIS_COURT[dateDe(s.date).getMonth()].replace('.','')}</span></div>
      <div class="day-t"><b>${esc(s.nom)}</b><span>S${s.semaine} · ${fmtDuree(s.duree||0)} · ${Math.round(tonnage(s)).toLocaleString('fr-FR')} kg · RPE ${s.rpeGlobal||'—'}</span></div>
    </button>`).join('')
  : '<div class="empty card"><div class="ei">▤</div><b>Rien encore</b><p>Chaque séance terminée vient s’inscrire ici, avec son tonnage et sa difficulté.</p></div>'}`;
}
</script>

<script>
"use strict";
/* ─── 12. Fenêtres : mesures, historique, fiche exercice ─────────────── */
function modalMesure(dateExistante){
  const m = dateExistante ? S.mesures.find(x => x.date === dateExistante) : null;
  const d = m || {date:aujourdhui()};
  const ch = (k, l, u, pas, ph) => `<div class="field"><label>${l}</label>
    <input class="inp inp-num" id="me-${k}" type="number" inputmode="decimal" step="${pas}" value="${d[k] ?? ''}" placeholder="${ph||'—'}">
    ${u ? `<div class="hint">${u}</div>` : ''}</div>`;
  ouvrirModal(`
    <div class="modal-h"><h3>${m ? 'Modifier la mesure' : 'Nouvelle mesure'}</h3><button class="icon-btn" data-fermer>✕</button></div>
    <div class="field"><label>Date</label><input class="inp" id="me-date" type="date" value="${d.date}"></div>
    ${ch('poids','Poids','Au réveil, à jeun, après être passé aux toilettes : c’est la seule façon de comparer deux pesées.','0.1','kg')}
    <div class="grid g2">
      ${ch('tourTaille','Tour de taille','','0.5','cm')}
      ${ch('hanches','Tour de hanches','','0.5','cm')}
      ${ch('bras','Bras contracté','','0.5','cm')}
      ${ch('cuisse','Cuisse','','0.5','cm')}
    </div>
    <div class="sec-title" style="margin-top:8px">Scan corporel${S.profil.options.visbody||S.profil.options.sismo ? ' (Visbody)' : ''}</div>
    <div class="grid g2">
      ${ch('mg','Masse grasse','','0.1','%')}
      ${ch('mm','Masse musculaire','','0.1','kg')}
    </div>
    <div class="field"><label>Note</label><input class="inp" id="me-note" value="${esc(d.note || '')}" placeholder="Contexte, ressenti, conditions de mesure…"></div>
    <button class="btn pri lg" id="me-ok">Enregistrer</button>
    ${m ? '<button class="btn ghost danger lg" id="me-del" style="margin-top:8px">Supprimer</button>' : ''}`);
  $('#me-ok').addEventListener('click', () => {
    const v = {date:$('#me-date').value || aujourdhui(), note:$('#me-note').value.trim()};
    ['poids','tourTaille','hanches','bras','cuisse','mg','mm'].forEach(k => { const n = num($('#me-'+k).value); if (n > 0) v[k] = n; });
    if (!v.poids && !v.tourTaille && !v.mg){ toast('Renseignez au moins un chiffre.'); return; }
    const i = S.mesures.findIndex(x => x.date === (dateExistante || v.date));
    if (i >= 0) S.mesures[i] = v; else S.mesures.push(v);
    S.mesures.sort((a,b) => a.date < b.date ? -1 : 1);
    sauver(); fermerModal(); rendreSuivi(); rendreJour();
    toast('Mesure enregistrée.');
  });
  $('#me-del')?.addEventListener('click', () => {
    S.mesures = S.mesures.filter(x => x.date !== dateExistante);
    sauver(); fermerModal(); rendreSuivi(); toast('Mesure supprimée.');
  });
}
function modalProgressionExo(id){
  const e = EXO_MAP[id], pr = S.prs[id];
  const pts = [];
  S.seances.filter(s => s.termine).sort((a,b) => a.date < b.date ? -1 : 1).forEach(s => {
    const ex = (s.exercices || []).find(x => x.ex === id); if (!ex) return;
    const best = (ex.series || []).filter(y => y.fait && !y.echauffement && num(y.charge) > 0)
      .reduce((m, y) => Math.max(m, e1rm(num(y.charge), num(y.reps))), 0);
    if (best > 0) pts.push({date:s.date, y:rnd(best,1)});
  });
  const d0 = pts.length ? pts[0].date : aujourdhui();
  ouvrirModal(`
    <div class="modal-h"><h3>${esc(e.n)}</h3><button class="icon-btn" data-fermer>✕</button></div>
    ${pr ? `<div class="grid g3" style="margin-bottom:14px">
      <div class="stat accent"><div class="k">1RM est.</div><div class="v" style="font-size:21px">${rnd(pr.e1rm,1)}<span class="u">kg</span></div></div>
      <div class="stat"><div class="k">Record</div><div class="v" style="font-size:21px">${pr.charge}<span class="u">×${pr.reps}</span></div></div>
      <div class="stat"><div class="k">Le</div><div class="v" style="font-size:15px;font-family:var(--sans)">${dateCourte(pr.date)}</div></div>
    </div>` : ''}
    ${courbe([{n:'1RM estimé', d:pts.map(p => ({x:joursEntre(d0, p.date), y:p.y})), c:'var(--accent)', aire:true}],
      {h:150, alt:'Progression', vide:'Deux séances sur cet exercice suffiront à tracer la courbe.'})}
    ${pr ? `<div class="sec-title">Charges de travail</div>
      ${[[3,'force pure'],[5,'force'],[8,'force et volume'],[10,'volume'],[12,'volume et endurance'],[15,'endurance']].map(([r, n]) =>
        `<div class="split"><span class="sl">${r} répétitions <span class="muted">— ${n}</span></span>
          <span class="sv">${arrondiCharge(chargePour(pr.e1rm, r))} kg</span></div>`).join('')}
      <p class="tiny muted" style="margin-top:10px">Repères issus du 1RM estimé, à ajuster d'un cran selon la forme du jour.</p>` : ''}
    <button class="btn ghost lg" data-fiche="${id}" style="margin-top:14px">Voir l’exécution</button>`);
  $('#modal-c [data-fiche]')?.addEventListener('click', () => ficheExercice(id));
}
function modalHistorique(id){
  const s = S.seances.find(x => x.id === id); if (!s) return;
  ouvrirModal(`
    <div class="modal-h"><h3>${esc(s.nom)}</h3><button class="icon-btn" data-fermer>✕</button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      <span class="badge">${dateLongue(s.date)}</span><span class="badge">Semaine ${s.semaine}</span>
      <span class="badge">${fmtDuree(s.duree||0)}</span><span class="badge">RPE ${s.rpeGlobal||'—'}</span>
      ${s.formeAuDepart ? `<span class="badge">forme ${s.formeAuDepart}/100</span>` : ''}
    </div>
    ${(s.exercices||[]).map(x => {
      const e = EXO_MAP[x.ex]; const faites = (x.series||[]).filter(y => y.fait && !y.echauffement);
      if (!e || !faites.length) return '';
      return `<div style="padding:11px 0;border-bottom:1px solid var(--line)">
        <b style="font-size:13.5px">${esc(e.n)}</b>
        <div class="tiny num" style="color:var(--muted);margin-top:3px">${faites.map(y => `${y.charge||'—'}×${y.reps}${y.rpe?` @${y.rpe}`:''}`).join('   ·   ')}</div></div>`;
    }).join('')}
    <div class="split" style="margin-top:12px"><span class="sl">Tonnage</span><span class="sv">${Math.round(tonnage(s)).toLocaleString('fr-FR')} kg</span></div>

    <button class="btn ghost danger lg" id="hi-del" style="margin-top:14px">Supprimer cette séance</button>`);
  $('#hi-del').addEventListener('click', () => {
    if (!confirm('Supprimer définitivement cette séance ?')) return;
    S.seances = S.seances.filter(x => x.id !== id); sauver(); fermerModal(); rendreSuivi(); toast('Séance supprimée.');
  });
}
function ficheExercice(id){
  const e = EXO_MAP[id]; if (!e) return;
  const pr = S.prs[id];
  ouvrirModal(`
    <div class="modal-h"><h3>${esc(e.n)}</h3><button class="icon-btn" data-fermer>✕</button></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
      <span class="badge ${GROUPES[e.g].c}"><i class="dot"></i>${GROUPES[e.g].n}</span>
      <span class="badge">${['','Accessible','Intermédiaire','Technique'][e.nv]}</span>
      ${e.m.map(k => `<span class="badge">${MAT[k]}</span>`).join('')}
    </div>
    <div class="sec-title" style="margin-top:0">Exécution</div>

    <div class="note force"><b>L’erreur la plus fréquente.</b> ${esc(e.e)}</div>
    ${(e.ci||[]).length ? `<div class="note warn"><b>À surveiller.</b> Cet exercice sollicite : ${e.ci.map(c => CONTRAINTES.find(x => x.v === c).n.toLowerCase()).join(', ')}. Réduisez l’amplitude avant de réduire la charge.</div>` : ''}
    ${pr ? `<div class="split"><span class="sl">Votre record</span><span class="sv">${pr.charge} kg × ${pr.reps}</span></div>` : ''}
    <div class="sec-title">Si l’exercice ne convient pas</div>
    ${(e.a||[]).map(a => EXO_MAP[a]).filter(Boolean).map(x => `
      <button class="lib-i" data-fiche2="${x.i}"><div class="lib-g" style="color:var(--${GROUPES[x.g].c})">${GROUPES[x.g].n[0]}</div>
        <div class="lib-t"><b>${esc(x.n)}</b><span>${x.m.map(k => MAT[k]).join(' · ')}</span></div></button>`).join('')}`);
  $$('#modal-c [data-fiche2]').forEach(b => b.addEventListener('click', () => ficheExercice(b.dataset.fiche2)));
}

/* ─── 13. Vue « Nutrition » ──────────────────────────────────────────── */
const ALIMENTS = [
  ['Blanc de poulet', 100, 31], ['Steak haché 5 %', 100, 21], ['Œuf entier', 1, 6.5],
  ['Blanc d’œuf', 100, 11], ['Thon au naturel', 100, 26], ['Saumon', 100, 20],

];
function journalDuJour(){
  return S.nutrition.find(x => x.date === aujourdhui()) || {date:aujourdhui(), prot:0, eau:0, kcal:0};
}
function noterJour(champ, ecart){
  let j = S.nutrition.find(x => x.date === aujourdhui());
  if (!j){ j = {date:aujourdhui(), prot:0, eau:0, kcal:0}; S.nutrition.push(j); }
  j[champ] = Math.max(0, j[champ] + ecart);
  sauver(); rendreNutrition();
}

    <div class="sec-title">Ajouter de l’eau</div>
    <div class="chips">${[[250,'verre'],[500,'petite bouteille'],[750,'gourde'],[1500,'grande bouteille']].map(([n, l]) =>
      `<button class="chip sm" data-eau="${n}">+ ${n >= 1000 ? (n/1000)+' L' : n+' ml'} <span class="muted" style="font-weight:500">${l}</span></button>`).join('')}
      <button class="chip sm" data-eau="-250">− 250 ml</button></div>

  </div>

  <div class="card">
    <div class="card-h"><h3>Répartir la journée</h3><span class="sub">≈ ${m.proteinesParRepas} g par prise</span></div>
    ${[['Matin','Au réveil'],['Midi','Repas principal'],['Collation','Autour de la séance'],['Soir','Dernier repas']].map(([n, d]) => `
      <div class="split"><span class="sl"><b style="color:var(--text)">${n}</b> <span class="muted">— ${d}</span></span>
      <span class="sv">${m.proteinesParRepas} g</span></div>`).join('')}
    <p class="tiny muted" style="margin-top:10px">Quatre prises d'environ ${m.proteinesParRepas} g valent mieux qu'un seul gros repas protéiné : la synthèse musculaire se relance à chaque prise, elle ne se stocke pas.</p>
  </div>

  <div class="card">
    <div class="card-h"><h3>Où trouver les protéines</h3></div>
    ${ALIMENTS.map(([n, q, p]) => `<div class="split"><span class="sl">${n} <span class="muted">— ${q === 1 ? '1 unité' : q + ' g'}</span></span>
      <span class="sv">${p} g</span></div>`).join('')}
  </div>

  <div class="card">
    <div class="card-h"><h3>Zones cardiaques</h3><span class="sub">FC max estimée ${m.fcMax}</span></div>
    ${m.zones.map(z => `<div class="split"><span class="sl"><b style="color:var(--text)">${z.z} ${z.n}</b><br><span class="tiny muted">${z.d}</span></span>
      <span class="sv">${z.min}–${z.max}</span></div>`).join('')}
    <p class="tiny muted" style="margin-top:10px">Formule de Tanaka (208 − 0,7 × âge), plus fiable que « 220 − âge » passé quarante ans. L'essentiel du cardio se fait en zone 2, où l'on brûle sans entamer la récupération de la séance de force.</p>
  </div>

  <div class="card">
    <div class="card-h"><h3>Autour de la séance</h3></div>
    <div class="split"><span class="sl">2 à 3 h avant</span><span class="sv" style="font-family:var(--sans);font-weight:600;font-size:13px;max-width:60%">Repas complet, glucides et protéines</span></div>
    <div class="split"><span class="sl">Pendant</span><span class="sv" style="font-family:var(--sans);font-weight:600;font-size:13px;max-width:60%">500 à 750 ml d'eau</span></div>
    <div class="split"><span class="sl">Dans les 2 h après</span><span class="sv" style="font-family:var(--sans);font-weight:600;font-size:13px;max-width:60%">${m.proteinesParRepas} g de protéines et des glucides</span></div>
    <div class="note warn" style="margin-bottom:0"><b>Aucun complément n'est nécessaire.</b> La whey n'est qu'un moyen commode d'atteindre les ${m.prot} g quotidiens quand les repas n'y suffisent pas — rien de plus.</div>
  </div>`;

  $$('#v-nutrition [data-prot]').forEach(b => b.addEventListener('click', () => noterJour('prot', +b.dataset.prot)));
  $$('#v-nutrition [data-eau]').forEach(b => b.addEventListener('click', () => noterJour('eau', +b.dataset.eau)));
}
</script>

<script>
"use strict";
/* ─── 14. Vue « Réglages » ───────────────────────────────────────────── */
function rendreReglages(){
  const p = S.profil, m = metriques();
  const bascule = (k, titre, desc, on) => `<div class="sw ${on?'on':''}" data-sw="${k}">
    <div class="sw-t"><b>${titre}</b><span>${desc}</span></div><div class="sw-x"></div></div>`;
  $('#v-reglages').innerHTML = `
  <div style="padding:14px 0 2px"><h2 class="hero-h">Réglages</h2></div>

  <div class="card" style="margin-top:16px">
    <div class="card-h"><h3>Votre profil</h3><span class="sub">${OBJECTIFS[p.objectif].n}</span></div>
    <div class="split"><span class="sl">Corps</span><span class="sv">${p.age} ans · ${p.taille} cm · ${rnd(poidsActuel(),1)} kg</span></div>
    <div class="split"><span class="sl">Niveau</span><span class="sv" style="font-family:var(--sans);font-weight:600">${NIVEAUX[p.niveau].n}</span></div>
    <div class="split"><span class="sl">Semaine</span><span class="sv" style="font-family:var(--sans);font-weight:600">${p.jours.map(j => JOURS.find(x => x[0]===j)[1].slice(0,3)).join(' · ')}</span></div>
    <div class="split"><span class="sl">Séance</span><span class="sv">${p.duree} min</span></div>
    <div class="split"><span class="sl">Matériel</span><span class="sv" style="font-family:var(--sans);font-weight:600;font-size:13px;max-width:62%">${
      [...p.lieux.map(l => ({salle:'Salle',maison:'Maison',exterieur:'Dehors'})[l]),
       p.options.sismo?'Sismo/Visbody':'', p.options.water?'Water Sport':''].filter(Boolean).join(' · ')}</span></div>
    ${p.contraintes.length ? `<div class="split"><span class="sl">À ménager</span><span class="sv" style="font-family:var(--sans);font-weight:600">${p.contraintes.map(c => CONTRAINTES.find(x => x.v===c).n.replace(' sensible','')).join(' · ')}</span></div>` : ''}
    <button class="btn lg" id="rg-profil" style="margin-top:14px">Modifier mes paramètres</button>
    <p class="tiny muted" style="margin-top:8px">Le programme se régénère aussitôt : les séances déjà enregistrées ne bougent pas, les suivantes tiennent compte des nouveaux réglages.</p>
  </div>

  <div class="sec-title">Programme</div>
  <div class="card">
    <div class="split"><span class="sl">Départ</span><span class="sv">${dateCourte(p.debut)}</span></div>
    <div class="split"><span class="sl">Semaine en cours</span><span class="sv">${semaineCourante()} / 12</span></div>
    <div class="split"><span class="sl">Exercices remplacés</span><span class="sv">${Object.keys(S.personnalises).length}</span></div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn sm" id="rg-redemarrer">Redémarrer à la semaine 1</button>
      <button class="btn sm ghost" id="rg-reset-exos">Rétablir les exercices d’origine</button>
    </div>
  </div>

  <div class="sec-title">Préférences</div>
  <div class="card">
    <div class="field"><label>Thème</label>
      <select class="inp" id="rg-theme">
        <option value="auto" ${S.reglages.theme==='auto'?'selected':''}>Automatique (système)</option>
        <option value="light" ${S.reglages.theme==='light'?'selected':''}>Clair</option>
        <option value="dark" ${S.reglages.theme==='dark'?'selected':''}>Sombre</option>
      </select></div>
    <div class="field"><label>Repos par défaut</label>
      <select class="inp" id="rg-repos">${[60,75,90,120,150,180].map(v =>
        `<option value="${v}" ${S.reglages.reposDefaut===v?'selected':''}>${v} secondes</option>`).join('')}</select>
      <div class="hint">N'affecte que les exercices sans repos prescrit ; le programme impose le sien sur les exercices principaux.</div></div>
    <div class="field"><label>Pas de charge disponible</label>
      <select class="inp" id="rg-arrondi">${[0.5,1,1.25,2,2.5,5].map(v =>
        `<option value="${v}" ${S.reglages.arrondi===v?'selected':''}>${v} kg</option>`).join('')}</select>
      <div class="hint">Les charges proposées sont arrondies à ce pas. 2,5 kg correspond au plus petit disque courant en salle.</div></div>
    ${bascule('sonTimer','Signal de fin de repos','Deux bips et une vibration quand le minuteur arrive à zéro', S.reglages.sonTimer)}
    ${bascule('seriesEchauffement','Séries d’échauffement','Deux séries montantes ajoutées automatiquement sur les exercices principaux', S.reglages.seriesEchauffement)}
  </div>

  <div class="sec-title">Comprendre et apprendre</div>
  <button class="lib-i" id="rg-biblio"><div class="lib-g" style="color:var(--accent)">B</div>
    <div class="lib-t"><b>Bibliothèque d’exercices</b><span>${EXOS.length} mouvements, exécution et erreurs fréquentes</span></div></button>
  <button class="lib-i" id="rg-methode"><div class="lib-g" style="color:var(--cardio)">M</div>
    <div class="lib-t"><b>La méthode</b><span>Toutes les formules employées, et pourquoi</span></div></button>

  <div class="sec-title">Vos données</div>
  <div class="card">
    <div class="split"><span class="sl">Séances</span><span class="sv">${S.seances.filter(s => s.termine).length}</span></div>
    <div class="split"><span class="sl">Mesures</span><span class="sv">${S.mesures.length}</span></div>
    <div class="split"><span class="sl">Points du matin</span><span class="sv">${S.checkins.length}</span></div>
    <div class="btn-row" style="margin-top:14px">
      <button class="btn sm" id="rg-export">Exporter</button>
      <button class="btn sm ghost" id="rg-import">Importer</button>
    </div>
    <p class="tiny muted" style="margin-top:10px">Tout est enregistré sur cet appareil uniquement. Vider les données du site dans le navigateur effacerait l'historique — exportez de temps en temps.</p>
    <button class="btn ghost danger lg" id="rg-effacer" style="margin-top:12px">Tout effacer</button>
  </div>
  <p class="tiny muted" style="text-align:center;padding:16px 0 4px">Coach — application personnelle, sans compte ni serveur.<br>
    Ce programme ne remplace pas un avis médical. En cas de douleur qui persiste, consultez.</p>`;

  $('#rg-profil').addEventListener('click', () => ouvrirOnboarding());
  $('#rg-theme').addEventListener('change', e => { S.reglages.theme = e.target.value; appliquerTheme(); sauver(); });
  $('#rg-repos').addEventListener('change', e => { S.reglages.reposDefaut = +e.target.value; sauver(); });
  $('#rg-arrondi').addEventListener('change', e => { S.reglages.arrondi = +e.target.value; sauver(); });
  $$('#v-reglages [data-sw]').forEach(b => b.addEventListener('click', () => {
    S.reglages[b.dataset.sw] = !S.reglages[b.dataset.sw]; sauver(); rendreReglages();
  }));
  $('#rg-redemarrer').addEventListener('click', () => {
    if (!confirm('Repartir de la semaine 1 ? Vos séances et mesures sont conservées.')) return;
    const d = new Date(); S.profil.debut = iso(new Date(d.getTime() - ((d.getDay()+6)%7) * 864e5));
    sauver(); semaineVue = null; rendreProgramme(); rendreJour(); toast('Programme redémarré à la semaine 1.');
  });
  $('#rg-reset-exos').addEventListener('click', () => {
    S.personnalises = {}; sauver(); rendreReglages(); toast('Sélection d’exercices rétablie.');
  });
  $('#rg-biblio').addEventListener('click', modalBibliotheque);
  $('#rg-methode').addEventListener('click', modalMethode);
  $('#rg-export').addEventListener('click', exporter);
  $('#rg-import').addEventListener('click', importer);
  $('#rg-effacer').addEventListener('click', () => {
    if (!confirm('Effacer définitivement le profil, les séances, les mesures et les records ?')) return;
    if (!confirm('Dernière confirmation : cette action est irréversible.')) return;
    localStorage.removeItem(CLE); S = structuredClone(DEFAUTS); ouvrirOnboarding();
  });
}
function exporter(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `coach-${aujourdhui()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Fichier exporté.');
}
function importer(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.addEventListener('change', () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try{
        const d = JSON.parse(r.result);
        if (!d.profil) throw new Error('format');
        if (!confirm('Remplacer les données actuelles par celles du fichier ?')) return;
        S = fusion(structuredClone(DEFAUTS), d);
        sauver(); demarrerApp(); aller('jour'); toast('Données importées.');
      }catch(e){ toast('Fichier illisible ou d’un autre format.'); }
    };
    r.readAsText(f);
  });
  inp.click();
}

/* ─── 15. Bibliothèque et méthode ────────────────────────────────────── */
let filtreGroupe = 'tous';
function modalBibliotheque(){
  const dessiner = () => {
    const q = ($('#bi-q')?.value || '').toLowerCase();
    const liste = EXOS.filter(e => (filtreGroupe === 'tous' || e.g === filtreGroupe)
      && (!q || e.n.toLowerCase().includes(q) || e.c.toLowerCase().includes(q)));
    $('#bi-liste').innerHTML = liste.length ? liste.map(e => `<button class="lib-i" data-f="${e.i}">
      <div class="lib-g" style="color:var(--${GROUPES[e.g].c})">${GROUPES[e.g].n[0]}</div>
      <div class="lib-t"><b>${esc(e.n)}</b><span>${GROUPES[e.g].n} · ${e.m.map(k => MAT[k]).join(' · ')}</span></div></button>`).join('')
      : '<div class="empty"><b>Aucun résultat</b><p>Essayez un autre mot, ou changez de groupe musculaire.</p></div>';
    $$('#bi-liste [data-f]').forEach(b => b.addEventListener('click', () => ficheExercice(b.dataset.f)));
  };
  ouvrirModal(`
    <div class="modal-h"><h3>Bibliothèque</h3><button class="icon-btn" data-fermer>✕</button></div>
    <input class="inp" id="bi-q" placeholder="Chercher un exercice…" style="margin-bottom:10px">
    <div class="scroll-x" style="margin:0 0 12px;padding:0 0 6px">
      <button class="chip sm ${filtreGroupe==='tous'?'on':''}" data-g="tous" style="flex:none">Tous</button>
      ${Object.entries(GROUPES).map(([k, g]) => `<button class="chip sm ${filtreGroupe===k?'on':''}" data-g="${k}" style="flex:none">${g.n}</button>`).join('')}
    </div>
    <div id="bi-liste"></div>`);
  $('#bi-q').addEventListener('input', dessiner);
  $$('#modal-c [data-g]').forEach(b => b.addEventListener('click', () => {
    filtreGroupe = b.dataset.g;
    $$('#modal-c [data-g]').forEach(x => x.classList.toggle('on', x.dataset.g === filtreGroupe));
    dessiner();
  }));
  dessiner();
}
function modalMethode(){
  const m = metriques();
  ouvrirModal(`
    <div class="modal-h"><h3>La méthode</h3><button class="icon-btn" data-fermer>✕</button></div>
    <p class="tiny muted" style="margin-bottom:16px">Aucun chiffre de cette application ne sort d'une boîte noire. Voici exactement ce qui est calculé, et à partir de quoi.</p>

    <div class="sec-title" style="margin-top:0">Le programme</div>
    <p class="tiny" style="color:var(--text2);line-height:1.6">Douze semaines en trois blocs de quatre. Un bloc garde ses exercices trois semaines pour que la progression soit mesurable, puis décharge la quatrième : volume réduit de 40 %, charges inchangées. Les répétitions se resserrent d'un bloc à l'autre — 10-12 puis 8-10 puis 6-8 — pendant que les charges montent.</p>
    <p class="tiny" style="color:var(--text2);line-height:1.6;margin-top:8px"><b style="color:var(--text)">Double progression.</b> On ajoute des répétitions jusqu'au haut de la fourchette prescrite ; quand elle est atteinte à un RPE conforme, la charge monte de ${Math.round(NIVEAUX[S.profil.niveau].prog*100)} % et l'on repart en bas de fourchette. C'est lent, et c'est précisément pour cela que ça tient sur douze semaines.</p>
    <p class="tiny" style="color:var(--text2);line-height:1.6;margin-top:8px"><b style="color:var(--text)">RPE.</b> La difficulté ressentie, de 1 à 10. RPE 8 signifie qu'il restait deux répétitions en réserve. C'est plus fiable qu'un pourcentage figé, parce que votre force du jour varie de 10 % selon le sommeil et le stress.</p>

    <div class="sec-title">Les formules</div>
    <div class="split"><span class="sl">Métabolisme de base</span><span class="sv">${m.mb} kcal</span></div>
    <p class="tiny muted" style="margin:-4px 0 10px">Mifflin-St Jeor : 10 × poids + 6,25 × taille − 5 × âge ${S.profil.sexe === 'h' ? '+ 5' : '− 161'}.</p>
    <div class="split"><span class="sl">Dépense quotidienne</span><span class="sv">${m.de} kcal</span></div>
    <p class="tiny muted" style="margin:-4px 0 10px">Métabolisme de base × ${S.profil.activite} (votre niveau d'activité hors séances).</p>
    <div class="split"><span class="sl">1RM estimé</span><span class="sv">charge × (1 + reps / 30)</span></div>
    <p class="tiny muted" style="margin:-4px 0 10px">Formule d'Epley : elle convertit toute série en charge maximale théorique, ce qui rend comparables une série de 12 et une série de 5.</p>
    <div class="split"><span class="sl">Fréquence cardiaque max</span><span class="sv">${m.fcMax} bpm</span></div>
    <p class="tiny muted" style="margin:-4px 0 10px">Tanaka : 208 − 0,7 × âge, notablement plus juste que « 220 − âge » après quarante ans.</p>
    <div class="split"><span class="sl">Masse grasse</span><span class="sv">${m.mg} %</span></div>
    <p class="tiny muted" style="margin:-4px 0 10px">${m.mgMesuree ? 'Valeur issue de votre dernier scan corporel — toujours préférable à une estimation.' : 'Estimation de Deurenberg à partir de l’IMC, de l’âge et du sexe. Elle donne un ordre de grandeur, pas une mesure : un scan Visbody la remplacera dès qu’il sera enregistré.'}</p>
    <div class="split"><span class="sl">Score de forme</span><span class="sv">sur 100</span></div>
    <p class="tiny muted" style="margin:-4px 0 10px">Moyenne pondérée du point du matin : sommeil 28 %, énergie 24 %, courbatures 22 % (à l'envers), stress 16 % (à l'envers), envie 10 %. En dessous de 42, la séance du jour est ramenée à 60 % de son volume.</p>

    <div class="sec-title">Les limites</div>
    <div class="note warn"><b>Ce sont des estimations statistiques.</b> Le métabolisme réel varie de ±10 % d'une personne à l'autre à profil identique. Ces chiffres sont un point de départ : c'est votre courbe de poids sur trois semaines qui dira s'ils sont justes pour vous, et l'application vous proposera alors de les corriger.</div>
    <div class="note force" style="margin-bottom:0"><b>Une application n'est pas un médecin.</b> Douleur articulaire qui dure, gêne respiratoire, vertiges : arrêtez et consultez. Si vous reprenez après une longue interruption ou un problème de santé, faites valider ce programme par un médecin.</div>`);
}
</script>

<script>
"use strict";
/* ─── 16. Navigation, thème, démarrage ───────────────────────────────── */
const VUES = {jour:rendreJour, programme:rendreProgramme, seance:rendreSeance,
  suivi:rendreSuivi, nutrition:rendreNutrition, reglages:rendreReglages};
let vueCourante = 'jour';

function aller(vue){
  vueCourante = vue;
  $$('.view').forEach(v => v.classList.remove('on'));
  $('#v-' + vue).classList.add('on');
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.go === vue));
  $('#tabbar').classList.toggle('hide', vue === 'onboarding');
  if (VUES[vue]) VUES[vue]();
  window.scrollTo({top:0, behavior:'instant'});
  try{ history.replaceState(null, '', '#' + vue); }catch(e){}
}
const ICONES_THEME = {
  auto:  '<circle cx="12" cy="12" r="8"/><path d="M12 4v16" stroke-width="0"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/>',
  light: '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
  dark:  '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>'
};
function appliquerTheme(){
  const t = S.reglages.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const svg = $('#btn-theme svg');
  if (svg) svg.innerHTML = ICONES_THEME[t];
  $('#btn-theme')?.setAttribute('title', 'Thème : ' + {auto:'automatique', light:'clair', dark:'sombre'}[t]);
}
function themeSuivant(){
  const ordre = ['auto', 'light', 'dark'];
  S.reglages.theme = ordre[(ordre.indexOf(S.reglages.theme) + 1) % 3];
  appliquerTheme(); sauver();
  toast('Thème : ' + {auto:'automatique', light:'clair', dark:'sombre'}[S.reglages.theme]);
  if (vueCourante === 'reglages') rendreReglages();
}
function modalAide(){
  ouvrirModal(`
    <div class="modal-h"><h3>Comment s’en servir</h3><button class="icon-btn" data-fermer>✕</button></div>
    ${[['Chaque matin','Ouvrez « Aujourd’hui » et faites le point du matin. Cinq curseurs : le score qui en sort décide si la séance se fait complète, allégée, ou remplacée par de la récupération.'],
       ['Pendant la séance','Chaque série propose une charge, calculée d’après votre dernière performance sur le même exercice. Corrigez ce que vous avez réellement fait, validez la coche : le minuteur de repos démarre seul.'],
       ['Une machine occupée ?','« Remplacer » propose des exercices du même schéma moteur. Le choix est mémorisé pour tout le bloc, la progression continue sans rupture.'],
       ['Trois fois par semaine','Pesez-vous au réveil, à jeun. L’application ne regarde jamais la pesée du jour, seulement la moyenne sur sept jours — la seule qui ne mente pas.'],
       ['Toutes les quatre semaines','Refaites un scan corporel. C’est lui qui distingue une perte de gras d’une perte de muscle, ce que la balance est incapable de faire.'],
       ['Chaque semaine','L’onglet « Suivi » et l’encadré « Le coach vous dit » proposent les ajustements : calories, volume, décharge anticipée.']]
      .map(([t, d]) => `<div style="display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)">
        <div class="oi" style="width:32px;height:32px;flex:none;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800">•</div>
        <div><b style="font-size:13.5px">${t}</b><p class="tiny muted" style="margin-top:3px;line-height:1.5">${d}</p></div></div>`).join('')}
    <button class="btn ghost lg" id="ai-methode" style="margin-top:16px">Voir toutes les formules employées</button>`);
  $('#ai-methode').addEventListener('click', modalMethode);
}

/* Le rendu complet, après un import ou un changement de profil. */
function demarrerApp(){
  appliquerTheme();
  $('#brand-nom').textContent = S.profil.prenom ? esc(S.profil.prenom) : 'Coach';
  const sem = semaineCourante();
  $('#brand-sub').textContent = `Semaine ${sem} · ${PRESCRIPTION[blocDe(sem)].nom}`;
  $('#tabbar').classList.remove('hide');
}

function init(){
  charger();
  appliquerTheme();
  /* Barre du haut : trait de séparation dès que la page défile. */
  addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', scrollY > 6), {passive:true});
  $('#btn-theme').addEventListener('click', themeSuivant);
  $('#btn-aide').addEventListener('click', modalAide);
  $$('.tab').forEach(t => t.addEventListener('click', () => aller(t.dataset.go)));
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') fermerModal(); });
  document.addEventListener('click', e => { if (e.target.closest('[data-fermer]')) fermerModal(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') fermerModal(); });
  $('#timer-stop').addEventListener('click', arreterTimer);
  $('#timer-plus').addEventListener('click', () => { timerFin += 30000; timerTotal += 30; tickTimer(); });

  if (!S.profil.debut){ $('#tabbar').classList.add('hide'); ouvrirOnboarding(); return; }
  demarrerApp();
  const cible = (location.hash || '').replace('#', '');
  aller(VUES[cible] ? cible : 'jour');

  /* Le poids et la date changent pendant que l'application reste ouverte :
     on rafraîchit au retour au premier plan. */
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && VUES[vueCourante]) { demarrerApp(); VUES[vueCourante](); }
  });
  /* Fonctionnement hors connexion, quand la page est servie depuis /coach/. */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http') && location.pathname.startsWith('/coach'))
    addEventListener('load', () => navigator.serviceWorker.register('/coach/sw.js', {scope:'/coach/'}).catch(() => {}));
}
init();
</script>
